                function saveFile() {
                    if (!state.data) {
                        showToast('没有加载文件', 'warn'); return;
                    }
                    downloadFile(state.fileName || 'select.xml', generateXml(state.data), 'text/xml;charset=utf-8');
                    state.modified = false;
                    App.updateStatusBar();
                    showToast('已保存 XML');
                }
                function closeFile() {
                    if (state.modified) {
                        pixelConfirm('有未保存的修改，确定关闭吗？').then(ok => {
                            if (ok) doCloseFile();
                        });
                        return;
                    }
                    doCloseFile();
                }
                function doCloseFile() {
                    state.data = null; state.fileName = ''; state.modified = false;
                    state.selectedCell = null; state.undo.clear(); state.originalXmlText = '';
                    $('#sel-grid').innerHTML =
                    '<div style="text-align:center;padding:40px;color:var(--text-faint);font-size:12px">请先加载 XML 文件<br><br><span style="font-size:10px">支持 select.txt / salect.txt 格式</span>' +
                    '<div class="empty-actions" style="margin-top:16px"><button class="btn btn-primary" data-act="load">📂 加载文件</button><button class="btn btn-info" data-act="demo">🎲 试试示例</button></div></div>';
                    $('#sel-editor').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-faint);font-size:12px">点击左侧网格中的格子进行编辑</div>';
                    $('#sel-edit-info').textContent = '';
                    App.updateStatusBar();
                }

                function pushUndo(coalesce) {
                    if (!state.data) return;
                    const snap = deepClone(state.data);
                    if (coalesce) state.undo.pushCoalesced(snap);
                    else
                        state.undo.push(snap);
                    state.modified = true;
                    App.updateStatusBar();
                }

                function undoAction() {
                    if (!state.data) {
                        showToast('没有数据', 'error'); return;
                    }
                    const snap = state.undo.pop();
                    if (!snap) {
                        showToast('没有可撤销的操作', 'warn'); return;
                    }
                    state.data = snap;
                    renderAll();
                    showToast('已撤销');
                }

                function renderAll() {
                    renderGrid(); if (state.selectedCell) renderEditor();
                }
                function switchTab(tab) {
                    state.currentTab = tab;
                    $$('[data-sel-tab]').forEach(t => t.classList.toggle('active', t.dataset.selTab === tab));
                    state.selectedCell = null;
                    $('#sel-grid-toolbar').style.display = tab === 'layout' ? 'none': 'flex';
                    if (tab === 'layout') {
                        $('#sel-grid-title').textContent = '布局设置';
                        renderLayoutInGrid();
                        $('#sel-editor').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-faint);font-size:12px">在左侧调整布局参数</div>';
                        $('#sel-edit-info').textContent = '';
                    } else {
                        $('#sel-grid-title').textContent = tab === 'char' ? '角色选择网格': '辅助选择网格';
                        renderGrid();
                    }
                }
                function currentList() {
                    return state.currentTab === 'char' ? state.data.char_list: state.data.assist_list;
                }

                /* 格子内容 HTML 生成（renderGrid 与 patchCell 共用） */
                function cellContentHTML(item, row, col) {
                    const name = Dict.charName(item.id);
                    return '<span class="cell-idx">' + (row * 10 + col + 1) + '</span>' +
                    (item.id
                        ? '<span class="cell-id">' + escHtml(item.id.length > 10 ? item.id.substring(0, 9) + '…': item.id) + '</span>' +
                        (state.showNames && name ? '<span class="cell-name">' + escHtml(name) + '</span>': ''): '<span class="cell-id" style="color:var(--text-faint)">空</span>');
                }
                function renderGrid() {
                    if (!state.data) return;
                    const list = currentList();
                    const grid = $('#sel-grid');
                    let html = '<div class="preview-info">共 ' + list.length + ' 行 × 10 列 | 点击格子编辑，右键更多操作</div>';
                    list.forEach((row, ri) => {
                        html += '<div class="grid-row"><div class="grid-row-label">R' + (ri + 1) + '</div>';
                        row.items.forEach((item, ci) => {
                            const isEmpty = !item.id;
                            const isSel = state.selectedCell && state.selectedCell.row === ri && state.selectedCell.col === ci;
                            const hasMore = !!item.moreFighter;
                            html += '<div class="grid-cell' + (isEmpty ? ' empty': '') + (isSel ? ' selected': '') + (hasMore ? ' has-more': '') + '"' +
                            ' data-cell="1" data-row="' + ri + '" data-col="' + ci + '"' +
                            ' title="' + escAttr(item.id + (item.offset ? ' | offset:' + item.offset: '') + (hasMore ? ' | 变体:' + item.moreFighter: '')) + '">' +
                            cellContentHTML(item, ri, ci) + '</div>';
                        });
                        if (row.offset) html += '<div class="row-offset-info">row:' + escHtml(row.offset) + '</div>';
                        html += '</div>';
                    });
                    grid.innerHTML = html;
                }
                /* 局部 patch：只更新单个格子的 DOM（保持滚动与焦点） */
                function patchCell(row, col) {
                    if (!state.data || !state.root) return;
                    const list = currentList();
                    const item = list[row] && list[row].items && list[row].items[col];
                    if (!item) return;
                    const cell = state.root.querySelector('.grid-cell[data-row="' + row + '"][data-col="' + col + '"]');
                    if (!cell) return;
                    const isEmpty = !item.id;
                    const isSel = state.selectedCell && state.selectedCell.row === row && state.selectedCell.col === col;
                    const hasMore = !!item.moreFighter;
                    cell.className = 'grid-cell' + (isEmpty ? ' empty': '') + (isSel ? ' selected': '') + (hasMore ? ' has-more': '');
                    cell.title = item.id + (item.offset ? ' | offset:' + item.offset: '') + (hasMore ? ' | 变体:' + item.moreFighter: '');
                    cell.innerHTML = cellContentHTML(item, row, col);
                }
                function patchRowOffsetEl(row) {
                    if (!state.data || !state.root) return;
                    const rowData = currentList()[row];
                    if (!rowData) return;
                    const grid = $('#sel-grid');
                    const rows = grid.querySelectorAll('.grid-row');
                    const rowEl = rows[row];
                    if (!rowEl) return;
                    let offsetEl = rowEl.querySelector('.row-offset-info');
                    if (rowData.offset) {
                        if (!offsetEl) {
                            offsetEl = document.createElement('div');
                            offsetEl.className = 'row-offset-info';
                            rowEl.appendChild(offsetEl);
                        }
                        offsetEl.textContent = 'row:' + rowData.offset;
                    } else if (offsetEl) {
                        offsetEl.remove();
                    }
                }
                function updateMoreListEl() {
                    const el = $('#sel-more-list');
                    if (!el || !state.selectedCell) return;
                    const item = currentList()[state.selectedCell.row].items[state.selectedCell.col];
                    const moreTags = item.moreFighter
                    ? item.moreFighter.split(',').filter(Boolean).map((m, i) =>
                        '<span class="more-tag">' + escHtml(m) + ' (' + escHtml(Dict.charName(m) || '') + ') <span class="remove" data-op="delMore" data-idx="' + i + '">×</span></span>'
                    ).join(''): '';
                    el.innerHTML = moreTags || '<span style="font-size:10px;color:var(--text-faint)">无</span>';
                }

                function renderLayoutInGrid() {
                    if (!state.data) return;
                    const l = state.data.layout;

                    $('#sel-grid').innerHTML =
                    '<div class="edit-section" style="margin-top:8px">' +
                    '<h3>⚙ STAGE SETTING</h3>' +
                    '<div class="layout-grid">' +
                    LAYOUT_KEYS.map(k =>
                        '<div class="form-row"><label>' + k + '</label>' +
                        '<input type="number" value="' + escAttr(l[k] || 0) + '" data-layout="' + k + '"></div>'
                    ).join('') +
                    '</div>' +
                    '<div style="margin-top:12px;padding:10px;background:rgba(0,0,0,.3);border:1px solid var(--border-pixel)">' +
                    '<div id="sel-layout-size" style="font-size:10px;color:var(--text-dim);margin-bottom:6px"></div>' +
                    '<div class="layout-preview" id="sel-layout-preview">' +
                    '<div class="content-rect" id="sel-layout-rect"></div>' +
                    '<div style="position:absolute;top:2px;left:4px;font-size:7px;color:var(--accent-blue)">内容区域</div>' +
                    '</div>' +
                    '</div></div>';

                    // 等浏览器完成布局，再测量真实可用宽度
                    requestAnimationFrame(updateLayoutPreview);
                }
                function updateLayoutPreview() {
                    if (!state.data) return;
                    const grid = $('#sel-grid');
                    const previewEl = grid.querySelector('#sel-layout-preview');
                    const rectEl = grid.querySelector('#sel-layout-rect');
                    const sizeEl = grid.querySelector('#sel-layout-size');
                    if (!previewEl || !rectEl) return;

                    const l = state.data.layout;
                    const realW = Math.max(1, parseInt(l.width, 10) || 800);
                    const realH = Math.max(1, parseInt(l.height, 10) || 600);
                    const isMobile = document.documentElement.getAttribute('data-view') === 'mobile';

                    // ① 可用宽度 = 预览框当前能拿到的宽度（首次渲染时它撑满父级）
                    // 之后每次重算时它已被设过 width，所以要临时还原成 auto 再量
                    previewEl.style.width = 'auto';
                    previewEl.style.height = 'auto';
                    const availW = previewEl.clientWidth || 300;

                    // ② 高度上限：不超过视口的一定比例，避免竖向撑爆
                    const maxH = Math.max(140, Math.round(window.innerHeight * (isMobile ? 0.42: 0.55)));

                    // ③ 等比缩放：宽优先，超上限才反过来压宽
                    let pw = availW;
                    let ph = Math.round(pw * realH / realW);
                    if (ph > maxH) {
                        ph = maxH;
                        pw = Math.round(ph * realW / realH);
                    }
                    pw = Math.max(60, pw);
                    ph = Math.max(40, ph);

                    previewEl.style.width = pw + 'px';
                    previewEl.style.height = ph + 'px';

                    // ④ content-rect 用同比例映射
                    const sx = pw / realW,
                    sy = ph / realH;
                    rectEl.style.top = ((parseInt(l.top, 10) || 0) * sy) + 'px';
                    rectEl.style.left = ((parseInt(l.left, 10) || 0) * sx) + 'px';
                    rectEl.style.right = ((parseInt(l.right, 10) || 0) * sx) + 'px';
                    rectEl.style.bottom = ((parseInt(l.bottom, 10) || 0) * sy) + 'px';

                    if (sizeEl) {
                        sizeEl.textContent = realW + '×' + realH +
                        ' · 显示 ' + pw + '×' + ph + 'px' +
                        ' · 缩放 ' + (pw / realW * 100).toFixed(0) + '%';
                    }
                }

                function updateLayout(attr, value) {
                    if (!state.data) return;
                    pushUndo(true); // ← 用 coalesced，连打字只存一次撤销点
                    state.data.layout[attr] = value;
                    updateLayoutPreview(); // ← 只更新预览，不动输入框
                }

                function selectCell(row, col) {
                    state.selectedCell = {
                        row,
                        col

                    renderGrid(); renderEditor();
                }
                function renderEditor() {
                    if (!state.data || !state.selectedCell) return;
                    const {
                        row,

                    } = state.selectedCell;
                    const list = currentList();
                    if (!list[row] || !list[row].items[col]) return;
                    const item = list[row].items[col];
                    const rowData = list[row];
                    const name = Dict.charName(item.id);
                    $('#sel-edit-info').textContent = (state.currentTab === 'char' ? '角色': '辅助') + ' [行' + (row + 1) + ' 列' + (col + 1) + ']';
                    const moreTags = item.moreFighter
                    ? item.moreFighter.split(',').filter(Boolean).map((m, i) => '<span class="more-tag">' + escHtml(m) + ' (' + escHtml(Dict.charName(m) || '') + ') <span class="remove" data-op="delMore" data-idx="' + i + '">×</span></span>').join(''): '';
                    $('#sel-editor').innerHTML =
                    '<div class="edit-section"><h3>📦 格子属性 [R' + (row + 1) + 'C' + (col + 1) + ']</h3>' +
                    '<div class="form-row"><label>角色 ID</label><input type="text" value="' + escAttr(item.id) + '" data-cf="id">' +
                    '<button class="btn btn-info btn-small" data-op="pick" style="font-size:9px;padding:3px 8px">选择</button></div>' +
                    '<div class="form-row"><label>名称</label><span id="sel-item-name" style="font-size:11px;color:var(--accent-blue)">' + escHtml(name || '(未知)') + '</span></div>' +
                    '<div class="form-row"><label>偏移 (offset)</label><input type="text" value="' + escAttr(item.offset) + '" data-cf="offset" placeholder="如 -10,0"></div>' +
                    '<div class="form-row" style="flex-direction:column;align-items:flex-start"><label style="margin-bottom:4px">变体 (moreFighter)</label>' +
                    '<div class="more-list" id="sel-more-list">' + (moreTags || '<span style="font-size:10px;color:var(--text-faint)">无</span>') + '</div>' +
                    '<div class="add-more-row"><input type="text" id="sel-more-input" placeholder="输入变体角色ID">' +
                    '<button class="btn btn-primary btn-small" data-op="addMore">+ 添加</button>' +
                    '<button class="btn btn-info btn-small" data-op="morePick" style="font-size:9px;padding:3px 8px">选择</button></div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="edit-section"><h3>📐 行属性 (第 ' + (row + 1) + ' 行)</h3>' +
                    '<div class="form-row"><label>行偏移</label><input type="text" value="' + escAttr(rowData.offset) + '" data-ro="1" placeholder="如 40,-20"><span style="font-size:9px;color:var(--text-faint)">格式: x,y</span></div>' +
                    '<div class="form-row"><label>行内容</label><span style="font-size:10px;color:var(--text-dim)">' + rowData.items.filter(x => x.id).length + ' / 10 个角色</span></div>' +
                    '</div>' +
                    '<div class="edit-section"><h3>🔧 行操作</h3><div style="display:flex;gap:6px;flex-wrap:wrap">' +
                    '<button class="btn btn-primary btn-small" data-op="rowUp" data-row="' + row + '">⬆ 上移行</button>' +
                    '<button class="btn btn-primary btn-small" data-op="rowDown" data-row="' + row + '">⬇ 下移行</button>' +
                    '<button class="btn btn-warning btn-small" data-op="rowDel" data-row="' + row + '">🗑 删除行</button>' +
                    '<button class="btn btn-info btn-small" data-op="rowCopy" data-row="' + row + '">📋 复制行</button>' +
                    '<button class="btn btn-warning btn-small" data-op="rowClear" data-row="' + row + '">🧹 清空行</button>' +
                    '</div></div>';
                }

                /* 局部 patch：格子字段修改（id / offset / moreFighter） */
                function updateItem(attr, value) {
                    if (!state.data || !state.selectedCell) return;
                    pushUndo(true);
                    const {
                        row,
                        col
                    } = state.selectedCell;
                    currentList()[row].items[col][attr] = value;
                    patchCell(row, col);
                    if (attr === 'id') {
                        const nameSpan = $('#sel-editor #sel-item-name');
                        if (nameSpan) nameSpan.textContent = Dict.charName(value) || '(未知)';
                    }
                    App.updateStatusBar();
                }
                function updateRowOffset(value) {
                    if (!state.data || !state.selectedCell) return;
                    pushUndo(true);
                    const row = state.selectedCell.row;
                    currentList()[row].offset = value;
                    patchRowOffsetEl(row);
                    App.updateStatusBar();
                }
                function addMore() {
                    const input = $('#sel-more-input');
                    if (!input) return;
                    const val = input.value.trim();
                    if (!val || !state.selectedCell) return;
                    pushUndo();
                    const item = currentList()[state.selectedCell.row].items[state.selectedCell.col];
                    item.moreFighter = item.moreFighter ? item.moreFighter + ',' + val: val;
                    input.value = '';
                    updateMoreListEl();
                    patchCell(state.selectedCell.row, state.selectedCell.col);
                    App.updateStatusBar();
                }
                function removeMore(idx) {
                    if (!state.selectedCell) return;
                    pushUndo();
                    const item = currentList()[state.selectedCell.row].items[state.selectedCell.col];
                    const parts = (item.moreFighter || '').split(',').filter(Boolean);
                    parts.splice(idx, 1);
                    item.moreFighter = parts.join(',');
                    updateMoreListEl();
                    patchCell(state.selectedCell.row, state.selectedCell.col);
                    App.updateStatusBar();
                }
                function addRow() {
                    if (!state.data) return;
                    pushUndo();
                    currentList().push(EMPTY_ROW());
                    renderGrid();
                }
                function removeLastRow() {
                    if (!state.data) return;
                    const list = currentList();
                    if (!list.length) return;
                    pixelConfirm('确定删除最后一行吗？').then(ok => {
                        if (!ok) return;
                        pushUndo();
                        list.pop();
                        renderGrid();
                    });
                }
                function moveRow(rowIdx, dir) {
                    if (!state.data) return;
                    const list = currentList();
                    const ni = rowIdx + dir;
                    if (ni < 0 || ni >= list.length) return;
                    pushUndo();
                    [list[rowIdx],
                        list[ni]] = [list[ni],
                        list[rowIdx]];
                    if (state.selectedCell) state.selectedCell.row = ni;
                    renderAll();
                }
                function deleteRow(rowIdx) {
                    if (!state.data) return;
                    pixelConfirm('确定删除第 ' + (rowIdx + 1) + ' 行吗？').then(ok => {
                        if (!ok) return;
                        pushUndo();
                        currentList().splice(rowIdx, 1);
                        state.selectedCell = null;
                        renderGrid();
                        $('#sel-editor').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-faint)">点击格子编辑</div>';
                    });
                }
                function copyRow(rowIdx) {
                    if (!state.data) return;
                    pushUndo();
                    const list = currentList();
                    list.splice(rowIdx + 1, 0, deepClone(list[rowIdx]));
                    renderGrid();
                }
                function clearRow(rowIdx) {
                    if (!state.data) return;
                    pushUndo();
                    currentList()[rowIdx].items = Array(10).fill(null).map(EMPTY_CELL);
                    renderAll();
                }
                function clearEmptyCells() {
                    if (!state.data) return;
                    pixelConfirm('确定清空所有空白格子吗？（移除空格的 offset 属性）').then(ok => {
                        if (!ok) return;
                        pushUndo();
                        [state.data.char_list,
                            state.data.assist_list].forEach(list =>
                            list.forEach(row => row.items.forEach(item => {
                                if (!item.id) {
                                    item.offset = ''; item.moreFighter = '';
                                }
                            }))
                        );
                        renderAll();
                    });
                }
                let ctxTarget = null;
                function showCtx(e, row, col) {
                    ctxTarget = {
                        row, col
                    };
                    const menu = $('#sel-ctx');
                    menu.style.left = Math.min(e.clientX, window.innerWidth - 170) + 'px';
                    menu.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
                    menu.classList.add('show');
                }
                function ctxAction(action) {
                    if (!ctxTarget || !state.data) return;
                    const {
                        row,
                        col
                    } = ctxTarget;
                    if (action === 'edit') selectCell(row, col);
                    else if (action === 'pick') {
                        selectCell(row, col); openCellPicker();
                    } else if (action === 'clear') {
                        pushUndo(); currentList()[row].items[col] = EMPTY_CELL(); renderAll();
                    } else if (action === 'copy') state.clipboard = deepClone(currentList()[row].items[col]);
                    else if (action === 'paste') {
                        if (state.clipboard) {
                            pushUndo(); currentList()[row].items[col] = deepClone(state.clipboard); renderAll();
                        }
                    } else if (action === 'swap') {
                        if (state.selectedCell && (state.selectedCell.row !== row || state.selectedCell.col !== col)) {
                            pushUndo();
                            const a = currentList()[row].items[col];
                            const b = currentList()[state.selectedCell.row].items[state.selectedCell.col];
                            currentList()[row].items[col] = deepClone(b);
                            currentList()[state.selectedCell.row].items[state.selectedCell.col] = deepClone(a);
                            renderAll();
                        }
                    }
                    $('#sel-ctx').classList.remove('show');
                }
                function openCellPicker() {
                    if (!state.selectedCell) return;
                    const cur = currentList()[state.selectedCell.row].items[state.selectedCell.col].id;
                    Picker.open({
                        title: '选择角色', items: Dict.fighterList, currentId: cur,
                        onPick: id => {
                            pushUndo(); currentList()[state.selectedCell.row].items[state.selectedCell.col].id = id; renderAll();
                        }
                    });
                }
                function openMorePicker() {
                    if (!state.selectedCell) return;
                    Picker.open({
                        title: '选择变体角色', items: Dict.fighterList, currentId: '',
                        onPick: id => {
                            pushUndo();
                            const item = currentList()[state.selectedCell.row].items[state.selectedCell.col];
                            item.moreFighter = item.moreFighter ? item.moreFighter + ',' + id: id;
                            renderAll();
                        }
                    });
                }
                function openDictModal() {
                    openModal({
                        title: '📥 导入字典', width: '520px',
                        bodyHTML: '<div class="import-zone" id="sel-import-zone"><p>📂 点击选择 fighter.json / assist.json / map.json 或通用字典文件</p><p style="font-size:9px;color:var(--text-faint);margin-top:4px">支持自动识别文件类型</p></div>' +
                        '<div class="import-result" id="sel-import-result"></div>',
                        footerHTML: '<button class="btn btn-primary btn-small" id="sel-dict-close">关闭</button>'
                    });
                    $('#sel-dict-close', modalEl).onclick = closeModal;
                    $('#sel-import-zone', modalEl).onclick = async () => {
                        try {
                            const {
                                text
                            } = await pickFile('.json');
                            const json = JSON.parse(text);
                            const r = Dict.importData(json);
                            const res = $('#sel-import-result', modalEl);
                            if (r.ok) {
                                res.className = 'import-result ok'; res.textContent = '✓ ' + r.msg; showToast('字典导入成功: ' + r.msg);
                            } else {
                                res.className = 'import-result err'; res.textContent = '✗ ' + r.msg;
                            }
                            renderAll();
                        } catch (err) {
                            const res = $('#sel-import-result', modalEl);
                            res.className = 'import-result err'; res.textContent = '✗ 导入失败: ' + err.message;
                        }
                    };
                }
                function showSourceEditor() {
                    if (!state.data) {
                        showToast('没有加载文件', 'warn'); return;
                    }
                    openModal({
                        title: 'XML 源码编辑', width: '820px',
                        bodyHTML: '<textarea class="json-editor" id="sel-source">' + escHtml(generateXml(state.data)) + '</textarea>',
                        footerHTML: '<button class="btn btn-warning btn-small" id="sel-src-apply">应用修改</button><button class="btn btn-primary btn-small" id="sel-src-cancel">取消</button>'
                    });
                    $('#sel-src-cancel', modalEl).onclick = closeModal;
                    $('#sel-src-apply', modalEl).onclick = () => {
                        const parsed = parseXml($('#sel-source', modalEl.querySelector('.modal-body')).value);
                        if (parsed) {
                            pushUndo(); state.data = parsed; renderAll(); closeModal(); showToast('源码已应用');
                        }
                    };
                }
                function computeLineDiff(a, b) {
                    const n = a.length,
                    m = b.length;
                    const dp = Array.from({
                        length: n + 1
                    }, () => new Uint32Array(m + 1));
                    for (let i = n - 1; i >= 0; i--) {
                        for (let j = m - 1; j >= 0; j--) {
                            if (a[i] === b[j]) dp[i][j] = dp[i + 1][j + 1] + 1;
                            else dp[i][j] = dp[i + 1][j] >= dp[i][j + 1] ? dp[i + 1][j]: dp[i][j + 1];
                        }
                    }
                    const out = [];
                    let i = 0,
                    j = 0;
                    while (i < n && j < m) {
                        if (a[i] === b[j]) {
                            out.push({
                                t: 'same', s: a[i]
                            }); i++; j++;
                        } else if (dp[i + 1][j] >= dp[i][j + 1]) {
                            out.push({
                                t: 'del', s: a[i]
                            }); i++;
                        } else {
                            out.push({
                                t: 'add', s: b[j]
                            }); j++;
                        }
                    }
                    while (i < n) out.push({
                        t: 'del', s: a[i++]
                    });
                    while (j < m) out.push({
                        t: 'add', s: b[j++]
                    });
                    return out;
                }
                function showDiff() {
                    if (!state.data || !state.originalXmlText) {
                        showToast('没有加载文件或没有原始内容', 'warn'); return;
                    }
                    const origLines = state.originalXmlText.split('\n');
                    const currLines = generateXml(state.data).split('\n');
                    const diffs = computeLineDiff(origLines, currLines);
                    let added = 0,
                    removed = 0,
                    same = 0;
                    diffs.forEach(d => {
                        if (d.t === 'add') added++;
                        else if (d.t === 'del') removed++;
                        else same++;
                    });
                    let html = '<div style="margin-bottom:8px;font-size:11px;color:var(--text-dim)">' +
                    '原始文件 vs 当前编辑 — ' +
                    '<span style="color:var(--accent-green)">+' + added + '</span> ' +
                    '<span style="color:var(--accent-red)">-' + removed + '</span> ' +
                    '<span style="color:var(--text-faint)">相同 ' + same + '</span></div>';
                    if (added === 0 && removed === 0) {
                        html += '<div style="color:var(--text-faint);padding:20px;text-align:center;font-size:12px">无变化</div>';
                    } else {
                        const CTX = 3;
                        const keep = new Array(diffs.length).fill(false);
                        diffs.forEach((d, i) => {
                            if (d.t !== 'same') {
                                for (let k = Math.max(0, i - CTX); k <= Math.min(diffs.length - 1, i + CTX); k++) keep[k] = true;
                            }
                        });
                        let lastShown = false;
                        diffs.forEach((d, i) => {
                            if (!keep[i]) {
                                if (lastShown) {
                                    html += '<div class="diff-line diff-same" style="opacity:.4">  ...</div>';
                                    lastShown = false;
                                }
                                return;
                            }
                            if (d.t === 'same') html += '<div class="diff-line diff-same">  ' + escHtml(d.s) + '</div>';
                            else if (d.t === 'del') html += '<div class="diff-line diff-del">- ' + escHtml(d.s) + '</div>';
                            else html += '<div class="diff-line diff-add">+ ' + escHtml(d.s) + '</div>';
                            lastShown = true;
                        });
                    }
                    openModal({
                        title: '🔍 文件对比',
                        width: '820px',
                        bodyHTML: '<div style="font-size:10px;white-space:pre-wrap;font-family:monospace;line-height:1.5;max-height:60vh;overflow:auto">' + html + '</div>',
                        footerHTML: '<button class="btn btn-primary btn-small" id="sel-diff-close">关闭</button>'
                    });
                    $('#sel-diff-close',
                        modalEl).onclick = closeModal;
                }
                function getStatus() {
                    let info = '-';
                    if (state.data) {
                        const c = state.data.char_list.reduce((s, r) => s + r.items.filter(x => x.id).length, 0);
                        const a = state.data.assist_list.reduce((s, r) => s + r.items.filter(x => x.id).length, 0);
                        info = '角色:' + c + ' | 辅助:' + a + ' | ' + (state.currentTab === 'layout' ? '布局': '网格') + ' 模式';
                    }
                    return {
                        file: state.fileName || '',
                        info,
                        modified: state.modified,
                        badge: {
                            text: '选角模式',
                            cls: 'mode-select'
                        }
                    };
                }
                function loadDemo() {
                    const xml =
                    '<?xml version="1.0" encoding="utf-8"?>\n\n<select_config>\n' +
                    '\t<stage_setting>\n\t\t<layout x="0" y="0" width="1280" height="720" left="60" right="60" top="120" bottom="20"/>\n\t</stage_setting>\n\n' +
                    '\t<char_list>\n' +
                    '\t\t<row>\n\t\t\t<item>ichigo</item>\n\t\t\t<item>ichigo_bankai</item>\n\t\t\t<item>rukia</item>\n\t\t\t<item>renji</item>\n\t\t\t<item>byakuya</item>\n\t\t\t<item>naruto</item>\n\t\t\t<item>sasuke</item>\n\t\t\t<item>sakura</item>\n\t\t\t<item>random</item>\n\t\t\t<item/>\n\t\t</row>\n\n' +
                    '\t\t<row offset="0,-20">\n\t\t\t<item>ichigo_vizored</item>\n\t\t\t<item moreFighter="ichigo_bankai,ichigo_vizored_half">ichigo_zero</item>\n\t\t\t<item>kenpachi</item>\n\t\t\t<item>aizen</item>\n\t\t\t<item>ulquiorra</item>\n\t\t\t<item>kakashi</item>\n\t\t\t<item>gaara</item>\n\t\t\t<item>itachi</item>\n\t\t\t<item/>\n\t\t\t<item/>\n\t\t</row>\n\n' +
                    '\t</char_list>\n\n\t<!-- 辅助选择界面 -->\n\n' +
                    '\t<assist_list>\n\t\t<row>\n\t\t\t<item>kon</item>\n\t\t\t<item>orihime</item>\n\t\t\t<item>yoruichi</item>\n\t\t\t<item>rangiku</item>\n\t\t\t<item>sakura</item>\n\t\t\t<item>temari</item>\n\t\t\t<item/>\n\t\t\t<item/>\n\t\t\t<item/>\n\t\t\t<item/>\n\t\t</row>\n\t</assist_list>\n</select_config>\n';
                    state.fileName = 'select_demo.txt';
                    state.originalXmlText = xml;
                    state.data = parseXml(xml);
                    if (state.data) {
                        state.modified = false; state.undo.clear(); state.selectedCell = null; state.currentTab = 'char';
                        $$('[data-sel-tab]').forEach(t => t.classList.toggle('active', t.dataset.selTab === 'char'));
                        $('#sel-grid-toolbar').style.display = 'flex';
                        $('#sel-grid-title').textContent = '角色选择网格';
                        renderAll();
                        showToast('已加载示例选角配置');
                        App.updateStatusBar();
                    }
                }
                return {
                    id: 'select',
                    title: '选角界面',
                    init,
                    activate,
                    getStatus,
                    shortcuts: {
                        save: saveFile,
                        load: loadFile,
                        undo: undoAction
                    }
                };
            })();
            App.registerModule(SelectEditor);
            document.addEventListener('keydown',
                e => {
                    const mod = App.current;
                    if (!mod || !mod.shortcuts) return;
                    const tag = (e.target && e.target.tagName) || '';
                    const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' ||
                    (e.target && e.target.isContentEditable);
                    const key = (e.key || '').toLowerCase();
                    const isMac = navigator.platform.indexOf('Mac') >= 0;
                    const cmd = isMac ? e.metaKey: e.ctrlKey;

                    if (cmd && key === 's') {
                        e.preventDefault();
                        if (mod.shortcuts.save) mod.shortcuts.save();
                        return;
                    }
                    if (cmd && key === 'o') {
                        e.preventDefault();
                        if (mod.shortcuts.load) mod.shortcuts.load();
                        return;
                    }
                    if (cmd && key === 'z' && !inField) {
                        e.preventDefault();
                        if (mod.shortcuts.undo) mod.shortcuts.undo();
                    }
                });
            window.addEventListener('beforeunload',
                e => {
                    const mod = App.current;
                    if (!mod || !mod.getStatus) return;
                    try {
                        const st = mod.getStatus();
                        if (st && st.modified) {
                            e.preventDefault();
                            e.returnValue = '';
                            return '';
                        }
                    } catch (err) {}
                });
            document.addEventListener('DOMContentLoaded',
                () => {
                    App.switchTo($$('.module-tab')[0].dataset.mod);
                });
        })();
    </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">    <title>BVN工作箱</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a14'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23e94560'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%234cc9f0'/%3E%3C/svg%3E">
    <link href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
:root {
            --bg-darkest: #0a0a14;
            --bg-dark: #12121f;
            --bg-panel: #1a1a2e;
            --bg-card: #16213e;
            --bg-input: #0d0d1a;
            --border-pixel: #2a2a4e;
            --border-blue: #0f3460;
            --text-main: #e8e8f0;
            --text-dim: #7a7a9a;
            --text-bright: #fff;
            --text-faint: #555;
            --accent-red: #e94560;
            --accent-red2: #ff6b81;
            --accent-orange: #f5a623;
            --accent-yellow: #f5c518;
            --accent-blue: #4cc9f0;
            --accent-green: #2ecc71;
            --accent-purple: #9b59b6;
            --pixel-font: 'Press Start 2P','Microsoft YaHei','Courier New',monospace;
            --ui-font: 'Microsoft YaHei','Segoe UI',sans-serif;
            --mono-font: 'Consolas','Courier New',monospace;
        }
        html,body {
            height: 100%
        }
        body {
            font-family: var(--ui-font);
            background: var(--bg-darkest);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
        }
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-darkest);
            border-left: 2px solid var(--border-pixel)
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-blue);
            border: 2px solid var(--accent-blue)
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #1a4a8a
        }

        .app-header {
            background: linear-gradient(180deg,#1e1e3a 0%,#12121f 100%);
            padding: 0 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 54px;
            flex: 0 0 auto;
            border-bottom: 3px solid var(--accent-red);
            box-shadow: 0 3px 0 #0a0a14,0 6px 20px rgba(233,69,96,.15);
            position: relative;
            z-index: 100;
        }
        .app-header::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            right: 0;
            height: 3px;
            background: repeating-linear-gradient(90deg,var(--accent-red) 0 8px,transparent 8px 16px)
        }
        .app-title {
            font-family: var(--pixel-font);
            font-size: 11px;
            color: var(--accent-red);
            white-space: nowrap;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #000,0 0 10px rgba(233,69,96,.5);
            animation: pixelPulse 3s ease-in-out infinite;
            cursor: default
        }
@keyframes pixelPulse {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: .7
            }}
        .module-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap
        }
        .module-tab {
            padding: 7px 14px;
            border: 2px solid var(--border-pixel);
            border-bottom: none;
            cursor: pointer;
            background: var(--bg-darkest);
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            font-family: var(--ui-font);
            transition: all .1s;
            position: relative;
            top: 0;
        }
        .module-tab:hover {
            color: var(--text-main);
            background: var(--bg-panel)
        }
        .module-tab.active {
            background: var(--bg-panel);
            color: var(--accent-red);
            border-color: var(--accent-red)
        }
        .spacer {
            flex: 1
        }
        .file-name {
            color: var(--accent-blue);
            font-size: 12px;
            font-family: var(--mono-font);
            background: var(--bg-input);
            padding: 4px 10px;
            border: 1px solid var(--border-pixel);
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        .mode-badge {
            padding: 4px 12px;
            font-size: 10px;
            font-weight: 700;
            font-family: var(--pixel-font);
            letter-spacing: .5px;
            border: 2px solid;
            white-space: nowrap
        }
        .mode-missions {
            background: var(--border-blue);
            color: var(--accent-blue);
            border-color: var(--accent-blue)
        }
        .mode-route {
            background: #4a1a2a;
            color: #ff9eb5;
            border-color: var(--accent-red)
        }
        .mode-data {
            background: #0d2a1a;
            color: var(--accent-green);
            border-color: var(--accent-green)
        }
        .mode-select {
            background: #2a1a3e;
            color: var(--accent-purple);
            border-color: var(--accent-purple)
        }

        .btn {
            padding: 8px 14px;
            border: 2px solid var(--border-pixel);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: var(--ui-font);
            transition: all .1s;
            position: relative;
            background: var(--bg-panel);
            color: var(--text-main);
            box-shadow: 3px 3px 0 #000;
            white-space: nowrap;
            user-select: none
        }
        .btn:hover {
            transform: translate(1px,1px);
            box-shadow: 2px 2px 0 #000
        }
        .btn:active {
            transform: translate(3px,3px);
            box-shadow: 0 0 0 #000
        }
        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 3px 3px 0 #000
        }
        .btn-primary {
            background: var(--border-blue);
            color: var(--accent-blue);
            border-color: var(--accent-blue)!important
        }
        .btn-primary:hover {
            background: #1a4a8a
        }
        .btn-success {
            background: #1a5c3a;
            color: var(--accent-green);
            border-color: var(--accent-green)!important
        }
        .btn-success:hover {
            background: #247a4e
        }
        .btn-danger {
            background: #5e1a2a;
            color: #ff9eb5;
            border-color: var(--accent-red)!important
        }
        .btn-danger:hover {
            background: #7a2a3e
        }
        .btn-warning {
            background: #5e4a1a;
            color: var(--accent-yellow);
            border-color: var(--accent-orange)!important
        }
        .btn-warning:hover {
            background: #7a6220
        }
        .btn-info {
            background: #123a4a;
            color: var(--accent-blue);
            border-color: var(--accent-blue)!important
        }
        .btn-info:hover {
            background: #1a4a6a
        }
        .btn-small {
            padding: 5px 10px;
            font-size: 11px;
            box-shadow: 2px 2px 0 #000!important
        }
        .btn-icon {
            padding: 6px 9px;
            font-size: 12px;
            line-height: 1;
            min-width: 30px;
            text-align: center
        }

        #workspace {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative
        }
        .module {
            display: none;
            flex: 1;
            min-width: 0;
            flex-direction: column
        }
        .module.active {
            display: flex
        }
        .mod-toolbar {
            flex: 0 0 auto;
            background: linear-gradient(180deg,#16162a,#0e0e1a);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border-pixel);
            position: relative;
            z-index: 60;
        }
        .mod-toolbar::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: repeating-linear-gradient(90deg,var(--accent-red) 0 6px,transparent 6px 12px);
            opacity: .35
        }
        .mod-toolbar label {
            font-size: 11px;
            color: var(--text-dim)
        }
        .mod-toolbar input[type=text],.mod-toolbar input[type=number],.mod-toolbar select {
            font-size: 11px;
            padding: 4px 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-pixel);
            color: var(--text-main);
            font-family: var(--ui-font)
        }
        .mod-toolbar input:focus,.mod-toolbar select:focus {
            outline: none;
            border-color: var(--accent-yellow)
        }
        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: var(--border-pixel);
            margin: 0 6px;
            flex: 0 0 auto
        }
        .mod-body {
            flex: 1;
            display: flex;
            min-height: 0
        }

        .toolbar-dropdown {
            position: relative;
            display: inline-block
        }
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            background: var(--bg-panel);
            border: 2px solid var(--border-pixel);
            box-shadow: 4px 4px 0 #000;
            min-width: 190px;
            display: none;
            z-index: 300;
            padding: 4px 0
        }
        .toolbar-dropdown.open .dropdown-menu {
            display: block
        }
        .toolbar-dropdown.open > .btn {
            background: #1a4a8a;
            border-color: var(--accent-yellow)!important;
            color: var(--accent-yellow)
        }
        .dd-item {
            padding: 9px 16px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-main);
            white-space: nowrap;
            transition: background .1s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600
        }
        .dd-item:hover {
            background: rgba(76,201,240,.15);
            color: var(--accent-blue)
        }
        .dd-item.danger {
            color: #ff9eb5
        }
        .dd-item.danger:hover {
            background: rgba(233,69,96,.2);
            color: var(--accent-red)
        }
        .dd-sep {
            height: 1px;
            background: var(--border-pixel);
            margin: 4px 0
        }

        .main-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 0
        }
        .left-panel {
            width: 300px;
            min-width: 300px;
            max-width: 42%;
            background: var(--bg-dark);
            border-right: 3px solid var(--border-pixel);
            display: flex;
            flex-direction: column;
            overflow: hidden
        }
        .panel-header {
            padding: 12px 14px;
            background: linear-gradient(90deg,var(--accent-red) 0%,#a83250 100%);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 1px;
            border-bottom: 3px solid #000;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,.3)
        }
        .panel-header .ph-btn {
            background: rgba(0,0,0,.3);
            border: 1px solid rgba(255,255,255,.35);
            color: #fff;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700
        }
        .panel-header .ph-btn:hover {
            background: rgba(255,255,255,.15)
        }
        .search-box {
            padding: 10px 14px;
            margin: 8px;
            border: 2px solid var(--border-pixel);
            background: var(--bg-input);
            color: var(--text-main);
            font-size: 13px;
            width: calc(100% - 16px);
            font-family: var(--ui-font)
        }
        .search-box:focus {
            outline: none;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 8px rgba(245,197,24,.2)
        }
        .search-box::placeholder {
            color: var(--text-dim)
        }
        .filter-bar {
            display: flex;
            gap: 6px;
            padding: 2px 8px 6px;
            flex-wrap: wrap
        }
        .filter-btn {
            padding: 4px 10px;
            font-size: 10px;
            border: 1px solid var(--border-pixel);
            background: var(--bg-panel);
            color: var(--text-dim);
            cursor: pointer;
            transition: all .1s;
            font-weight: 600;
            box-shadow: 1px 1px 0 #000
        }
        .filter-btn:hover,.filter-btn.active {
            background: var(--border-blue);
            color: var(--accent-blue);
            border-color: var(--accent-blue)
        }
        .item-list,.mission-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px
        }
        .item-card,.mission-item {
            padding: 10px 14px;
            margin-bottom: 4px;
            cursor: pointer;
            background: var(--bg-panel);
            border: 2px solid var(--border-pixel);
            transition: all .15s;
            box-shadow: 2px 2px 0 #000
        }
        .item-card:hover,.mission-item:hover {
            border-color: var(--accent-blue);
            background: #1e2a4a;
            transform: translate(1px,1px);
            box-shadow: 1px 1px 0 #000
        }
        .item-card.active,.mission-item.active {
            border-color: var(--accent-red);
            background: linear-gradient(90deg,#2a1a3e 0%,#1a1a2e 100%);
            box-shadow: 0 0 0 #000;
            transform: translate(2px,2px);
            border-left: 4px solid var(--accent-red)
        }
        .mi-info {
            flex: 1;
            min-width: 0
        }
        .mi-title {
            font-weight: 600;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        .mi-meta {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        .mi-actions {
            display: flex;
            gap: 4px
        }
        .ic-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px
        }
        .ic-name {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-bright);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        .ic-type {
            font-size: 9px;
            padding: 2px 6px;
            border: 1px solid;
            font-family: var(--pixel-font);
            flex: 0 0 auto
        }
        .type-bleach {
            color: var(--accent-blue);
            border-color: var(--accent-blue)!important
        }
        .type-naruto {
            color: var(--accent-orange);
            border-color: var(--accent-orange)!important
        }
        .type-other {
            color: var(--accent-green);
            border-color: var(--accent-green)!important
        }
        .type-random {
            color: var(--accent-purple);
            border-color: var(--accent-purple)!important
        }
        .ic-id {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 3px;
            font-family: var(--mono-font);
            word-break: break-all
        }
        .ic-extra {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 2px
        }
        .stats-bar {
            padding: 10px 14px;
            background: var(--bg-darkest);
            border-top: 3px solid var(--border-pixel);
            font-size: 11px;
            color: var(--text-dim);
            display: flex;
            gap: 16px;
            font-family: var(--pixel-font);
            letter-spacing: .5px;
            flex-wrap: wrap
        }
        .stats-bar b {
            color: var(--accent-yellow);
            font-weight: 400
        }

        .right-panel {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            min-width: 0;
            background: radial-gradient(ellipse at 20% 50%,rgba(15,52,96,.15) 0%,transparent 50%),
            radial-gradient(ellipse at 80% 80%,rgba(233,69,96,.08) 0%,transparent 50%),var(--bg-darkest)
        }
        .no-selection {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            font-size: 16px;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            padding: 20px
        }
        .no-selection svg {
            opacity: .2
        }
        .empty-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-wrap: wrap;
            justify-content: center
        }
        .edit-section {
            margin-bottom: 22px;
            background: var(--bg-panel);
            border: 2px solid var(--border-pixel);
            padding: 18px;
            position: relative;
            box-shadow: 4px 4px 0 #000
        }
        .edit-section::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            height: 4px;
            background: var(--accent-red)
        }
        .edit-section h3 {
            font-size: 11px;
            color: var(--accent-red);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px dashed var(--border-pixel);
            font-family: var(--pixel-font);
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #000;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }
        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 150px
        }
        .form-group.small {
            min-width: 110px;
            flex: 0 0 auto
        }
        .form-group label {
            font-size: 9px;
            color: var(--accent-blue);
            font-weight: 700;
            font-family: var(--pixel-font);
            letter-spacing: .5px;
            text-transform: uppercase
        }
        .form-group input,.form-group select,.form-group textarea {
            padding: 9px 12px;
            border: 2px solid var(--border-pixel);
            background: var(--bg-input);
            color: var(--text-main);
            font-size: 13px;
            font-family: var(--ui-font);
            transition: border-color .15s
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            font-size: 12px;
            line-height: 1.6
        }
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus {
            outline: none;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 8px rgba(245,197,24,.15)
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px
        }
        .checkbox-row input[type=checkbox] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-red);
            cursor: pointer
        }
        .checkbox-row label {
            font-size: 12px;
            color: var(--text-main);
            cursor: pointer
        }
        .id-name {
            color: var(--accent-blue);
            font-size: 11px;
            margin-left: 6px;
            font-weight: 400
        }
        .id-name-unknown {
            color: var(--accent-red);
            font-size: 11px;
            margin-left: 6px;
            font-style: italic
        }
        .enemy-name-badge {
            display: inline-block;
            background: #0d1b30;
            color: var(--accent-blue);
            padding: 3px 10px;
            font-size: 11px;
            margin-left: 4px;
            white-space: nowrap;
            border: 1px solid var(--accent-blue)
        }
        .enemy-name-badge.boss {
            background: #2a0d1a;
            color: #ff9eb5;
            border-color: var(--accent-red)
        }
        .boss-badge {
            background: var(--accent-red);
            color: #fff;
            padding: 3px 10px;
            font-size: 9px;
            font-weight: 700;
            font-family: var(--pixel-font);
            letter-spacing: .5px;
            box-shadow: 2px 2px 0 #000;
            display: inline-block
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 18px;
            border-bottom: 3px solid var(--border-pixel)
        }
        .tab-btn {
            padding: 9px 18px;
            border: 2px solid var(--border-pixel);
            border-bottom: none;
            cursor: pointer;
            background: var(--bg-darkest);
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            font-family: var(--ui-font);
            transition: all .1s;
            position: relative;
            top: 3px
        }
        .tab-btn:hover {
            color: var(--text-main);
            background: var(--bg-panel)
        }
        .tab-btn.active {
            background: var(--bg-panel);
            color: var(--accent-red);
            border-color: var(--accent-red);
            border-bottom: 3px solid var(--bg-panel)
        }
        .tab-content {
            display: none
        }
        .tab-content.active {
            display: block
        }

        .wave-card {
            background: var(--bg-card);
            border: 2px solid var(--border-pixel);
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: 3px 3px 0 #000
        }
        .wave-header {
            padding: 10px 14px;
            background: linear-gradient(90deg,var(--border-blue) 0%,#1a2a4a 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 2px solid var(--border-pixel);
            transition: background .15s
        }
        .wave-header:hover {
            background: linear-gradient(90deg,#1a4a8a 0%,#1e3050 100%)
        }
        .wave-header h4 {
            font-size: 10px;
            font-family: var(--pixel-font);
            color: var(--accent-blue);
            letter-spacing: .5px;
            display: flex;
            align-items: center;
            gap: 8px
        }
        .wave-toggle {
            font-size: 12px;
            color: var(--accent-yellow)
        }
        .wave-body {
            padding: 14px
        }
        .wave-body.collapsed {
            display: none
        }
        .enemy-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: fixed
        }
        .enemy-table th {

            color: var(--accent-red)
        }
        .ctx-sep {
            height: 1px;
            background: var(--border-pixel);

        }

        .mod-toolbar .tabs {

            gap: 4px;
            margin: 0;
            border: none
        }
        .mod-toolbar .tab-btn {

            border: 2px solid var(--border-pixel);
            border-bottom: 2px solid var(--border-pixel);
            padding: 7px 14px
        }
        .mod-toolbar .tab-btn.active {
            border-color: var(--accent-red);
            border-bottom: 2px solid var(--accent-red);
            background: var(--bg-panel)
        }
        #mod-select .left-panel .tabs .tab-btn {

            border: 2px solid var(--border-pixel);
            border-bottom: 2px solid var(--border-pixel);
            padding: 7px 14px
        }
        #mod-select .left-panel .tabs .tab-btn.active {

            border-bottom: 2px solid var(--bg-dark);

@media (max-width:1100px) {
            .left-panel {
                width: 250px;

            }}
@media (prefers-reduced-motion:reduce) {
            * {
                animation: none!important;
                transition: none!important
            }}

        /* ==========================================================
   手机端布局（iPhone 13 · 390×844 为目标基准）
   由 <html data-view="mobile"> 激活；桌面端完全不受影响
   ========================================================== */

        html[data-view="mobile"] {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        html[data-view="mobile"] * {
            -webkit-tap-highlight-color: transparent;
        }
        html[data-view="mobile"] ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        html[data-view="mobile"] ::-webkit-scrollbar-track {
            background: transparent;
            border: none;
        }
        html[data-view="mobile"] ::-webkit-scrollbar-thumb {
            background: rgba(76,201,240,.35);
            border: none;
        }
        html[data-view="mobile"] body {
            height: 100vh;
            height: 100dvh;
            /* iOS 地址栏收缩时自适应 */
            overflow: hidden;
            background-image: none;
            /* 去掉扫描线，省电、更干净 */
        }

        /* ---------- 顶部栏 ---------- */
        html[data-view="mobile"] .app-header {
            height: auto;
            min-height: 46px;
            flex-wrap: nowrap;
            gap: 8px;
            padding: calc(env(safe-area-inset-top, 0px) + 6px) 10px 6px;
        }
        html[data-view="mobile"] .app-title {
            font-size: 9px;
            letter-spacing: 0;
            flex: 0 0 auto;
        }
        html[data-view="mobile"] .file-name {
            max-width: 92px;
            font-size: 10px;
            padding: 3px 6px;
            flex: 0 1 auto;
        }
        html[data-view="mobile"] .mode-badge {
            display: none !important;
        }
        html[data-view="mobile"] #viewToggle {
            flex: 0 0 auto;
            padding: 6px 9px;
            font-size: 14px;
            min-height: 0;
        }

        /* ---------- 模块标签 → 底部导航 ---------- */
        html[data-view="mobile"] .module-tabs {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 200;
            display: flex;
            flex-wrap: nowrap;
            gap: 0;
            height: calc(52px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: linear-gradient(180deg, #16162a, #0e0e1a);
            border-top: 2px solid var(--border-pixel);
            box-shadow: 0 -4px 16px rgba(0,0,0,.6);
        }
        html[data-view="mobile"] .module-tab {
            flex: 1 1 0;
            min-width: 0;
            height: 52px;
            padding: 6px 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: none;
            border-top: 3px solid transparent;
            background: transparent;
            color: var(--text-dim);
            font-size: 11px;
            line-height: 1.2;
            white-space: normal;
        }
        html[data-view="mobile"] .module-tab.active {
            background: rgba(233,69,96,.08);
            color: var(--accent-red);
            border-top-color: var(--accent-red);
        }

        /* ---------- 状态栏 → 贴在底部导航上沿 ---------- */
        html[data-view="mobile"] .status-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(52px + env(safe-area-inset-bottom, 0px));
            z-index: 199;
            height: 20px;
            padding: 0 10px;
            gap: 10px;
            font-size: 8px;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            background: var(--bg-darkest);
            border-top: 1px solid var(--border-pixel);
            -webkit-overflow-scrolling: touch;
        }
        html[data-view="mobile"] .status-bar::-webkit-scrollbar {
            display: none;
        }
        html[data-view="mobile"] #stModified {
            margin-left: auto !important;
        }

        /* ---------- 工作区为底部栏留白 ---------- */
        html[data-view="mobile"] #workspace {
            padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
        }

        /* 手机端工具栏：允许换行，overflow 必须 visible，
   否则 dropdown-menu 会被裁剪导致「更多」点不出来 */
        html[data-view="mobile"] .mod-toolbar {
            flex-wrap: wrap;
            overflow: visible;
            padding: 6px 8px;
            gap: 6px;
            row-gap: 6px;
        }
        /* tabs 单独占满一行并横向滚动 */
        html[data-view="mobile"] .mod-toolbar .tabs {
            flex: 1 1 100%;
            min-width: 0;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 1px;
        }
        html[data-view="mobile"] .mod-toolbar .tabs::-webkit-scrollbar {
            display: none;
        }
        html[data-view="mobile"] .mod-toolbar .tab-btn {
            flex: 0 0 auto;
        }
        html[data-view="mobile"] .toolbar-sep {
            margin: 0 2px;
        }

        /* 下拉菜单在手机上的显示优化 */
        html[data-view="mobile"] .dropdown-menu {
            min-width: 180px;
            box-shadow: 3px 3px 0 #000;
            top: calc(100% + 4px);
            z-index: 500;
        }
        html[data-view="mobile"] .toolbar-dropdown {
            z-index: 501;
        }

        /* ===== 手机端按钮体系：3 档高度 + 1 档图标按钮 ===== */
        /* 一级：工具栏主操作（加载/保存/撤销/更多） */
        html[data-view="mobile"] .btn {
            padding: 0 14px;
            font-size: 13px;
            min-height: 38px;
            line-height: 1.25;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0 #000;
            touch-action: manipulation;
            white-space: nowrap;
        }
        /* 二级：次要动作 / 卡片内小按钮 */
        html[data-view="mobile"] .btn-small {
            padding: 0 12px;
            font-size: 12px;
            min-height: 32px;
        }
        /* 图标类按钮：正方形，与二级等高 */
        html[data-view="mobile"] .btn-icon {
            padding: 0;
            min-width: 32px;
            min-height: 32px;
            font-size: 14px;
        }
        /* 面板头按钮（+ 新增 / 关卡列表 / 角色列表） */
        html[data-view="mobile"] .ph-btn {
            padding: 0 12px;
            font-size: 12px;
            min-height: 30px;
            line-height: 1.2;
            display: inline-flex;
            align-items: center;
        }
        /* 表格/表单内嵌小按钮（"选择" / 过滤 / 地图标签） */
        html[data-view="mobile"] .pick-btn {
            padding: 0 8px;
            font-size: 10px;
            min-height: 26px;
            display: inline-flex;
            align-items: center;
            margin-left: 4px;
        }
        html[data-view="mobile"] .filter-btn {
            padding: 0 12px;
            font-size: 11px;
            min-height: 30px;
            display: inline-flex;
            align-items: center;
        }
        html[data-view="mobile"] .map-tag {
            padding: 0 12px;
            font-size: 12px;
            min-height: 32px;
            display: inline-flex;
            align-items: center;
            box-shadow: 1px 1px 0 #000;
        }
        /* 下拉菜单项：iOS HIG 推荐的 44px 触摸目标 */
        html[data-view="mobile"] .dd-item {
            padding: 12px 16px;
            font-size: 13px;
            min-height: 44px;
        }
        /* hover 残留清理 */
        html[data-view="mobile"] .btn:hover,
        html[data-view="mobile"] .pick-btn:hover,
        html[data-view="mobile"] .map-tag:hover {
            transform: none;
        }
        html[data-view="mobile"] .btn:active {
            transform: translate(2px,2px);
            box-shadow: 0 0 0 #000;
        }

    <script>
        (function () {
            var KEY = 'bvn_view_mode'; // 'auto' | 'mobile' | 'desktop'
            var html = document.documentElement;
            var mq = window.matchMedia('(max-width: 860px)');

            function getMode() {
                try {
                    return localStorage.getItem(KEY) || 'auto';
                } catch (e) {
                    return 'auto';
                }
            }
            function effective() {
                var m = getMode();
                return m === 'auto' ? (mq.matches ? 'mobile': 'desktop'): m;
            }
            function apply() {
                var eff = effective();
                html.setAttribute('data-view', eff);
                html.setAttribute('data-view-mode', getMode());
                updateBtn(eff);
                window.dispatchEvent(new CustomEvent('viewmodechange', {
                    detail: {
                        effective: eff
                    }
                }));
            }
            function updateBtn(eff) {
                var b = document.getElementById('viewToggle');
                if (!b) return;
                b.textContent = eff === 'mobile' ? '📱': '🖥';
                b.title = '当前：' + (eff === 'mobile' ? '手机': '桌面') + '（短按切换 / 长按恢复自动）';
            }
            window.__setViewMode = function (mode) {
                try {
                    if (mode === 'auto') localStorage.removeItem(KEY);
                    else localStorage.setItem(KEY, mode);
                } catch (e) {}
                apply();
            };
            window.__toggleView = function () {
                window.__setViewMode(effective() === 'mobile' ? 'desktop': 'mobile');
            };

            // 立即执行，避免闪烁
            apply();

            // 屏幕宽度变化时（仅 auto 模式）跟随
            if (mq.addEventListener) mq.addEventListener('change', function () {
                if (getMode() === 'auto') apply();
            });
            else if (mq.addListener) mq.addListener(function () {
                if (getMode() === 'auto') apply();
            });

            document.addEventListener('DOMContentLoaded',
                function () {
                    updateBtn(effective());
                    var b = document.getElementById('viewToggle');
                    if (!b) return;
                    var timer = null;
                    b.addEventListener('click', function (e) {
                        e.stopPropagation();
                        if (timer) {
                            clearTimeout(timer); timer = null; return;
                        } // 长按已触发
                        window.__toggleView();
                    });
                    b.addEventListener('touchstart',
                        function () {
                            timer = setTimeout(function () {
                                timer = null;
                                window.__setViewMode('auto');
                                if (window.showToast) showToast('已恢复自动识别');
                            },
                                600);
                        }, {
                            passive: true
                        });
                    ['touchend', 'touchcancel', 'touchmove'].forEach(function (ev) {
                        b.addEventListener(ev,
                            function () {
                                if (timer) {
                                    clearTimeout(timer); timer = null;
                                }
                            },
                            {
                                passive: true
                            });
                    });
                });
        })();
    </script>

    <script>
        (function () {
            'use strict';

            /* ================================================================
   工具函数
================================================================ */
            const $ = (sel,
                root) => (root || document).querySelector(sel);
            const $$ = (sel,
                root) => Array.from((root || document).querySelectorAll(sel));

            function escHtml(s) {
                return String(s == null ? '': s)
                .replace(/&/g,
                    '&amp;').replace(/</g,
                    '&lt;').replace(/>/g,
                    '&gt;')
                .replace(/"/g,
                    '&quot;').replace(/'/g,
                    '&#39;');
            }
            function escAttr(s) {
                return escHtml(s);
            }

            function deepClone(o) {
                if (typeof structuredClone === 'function') {
                    try {
                        return structuredClone(o);
                    } catch (e) {}
                }
                return JSON.parse(JSON.stringify(o));
            }

            /* ---------- 撤销栈：按总字节上限 + 条数上限双重限制 ----------
   maxBytes 默认 5MB（UTF-16 粗估 2 字节/字符），maxItems 默认 200 条。
   小文件可保留较多步，大文件自动压缩步数，避免内存爆掉。
----- ---------- 撤销栈（带编辑会话合并） ----------
   - push()          : 立即提交快照（结构性操作用）
   - pushCoalesced() : N 毫秒内的多次调用只保留「第一次」传入的状态，
                       即「编辑会话开始前的状态」，用于字段输入防抖
   - pop()           : 优先返回未提交的 pending（保证用户按 Ctrl+Z 时
                       立刻回到编辑前）
------------------------------------------------ */
            function createUndo(maxBytes, maxItems, coalesceMs) {
                const MAX_BYTES = maxBytes || (2 * 1024 * 1024);
                const MAX_ITEMS = maxItems || 100;
                const COALESCE_MS = coalesceMs || 800;
                const stack = [];
                let totalBytes = 0;
                let pending = null;
                let timer = null;

                function commit(state) {
                    const snap = JSON.stringify(state);
                    if (stack.length && stack[stack.length - 1].snap === snap) return false;
                    const bytes = snap.length * 2;
                    stack.push({
                        snap, bytes
                    });
                    totalBytes += bytes;
                    while ((totalBytes > MAX_BYTES || stack.length > MAX_ITEMS) && stack.length > 1) {
                        totalBytes -= stack.shift().bytes;
                    }
                    return true;
                }
                function flush() {
                    if (pending !== null) {
                        commit(pending);
                        pending = null;
                    }
                    if (timer) {
                        clearTimeout(timer); timer = null;
                    }
                }

                return {
                    get length() {
                        return stack.length + (pending !== null ? 1: 0);
                    },
                    get bytes() {
                        return totalBytes;
                    },
                    push(state) {
                        flush();
                        return commit(state);
                    },
                    pushCoalesced(state) {
                        // 同一编辑会话内（COALESCE_MS 内）只记录第一次的状态
                        if (pending === null) pending = state;
                        if (timer) clearTimeout(timer);
                        timer = setTimeout(flush, COALESCE_MS);
                    },
                    pop() {
                        // 有未提交的编辑会话 → 直接回到「编辑前」
                        if (pending !== null) {
                            const p = pending;
                            pending = null;
                            if (timer) {
                                clearTimeout(timer); timer = null;
                            }
                            return p;
                        }
                        if (!stack.length) return null;
                        const last = stack.pop();
                        totalBytes -= last.bytes;
                        try {
                            return JSON.parse(last.snap);
                        } catch (e) {
                            return null;
                        }
                    },
                    clear() {
                        stack.length = 0;
                        totalBytes = 0;
                        pending = null;
                        if (timer) {
                            clearTimeout(timer); timer = null;
                        }
                    }
                };
            }
            /* ---------- Toast ---------- */
            let toastTimer = null;
            function showToast(msg, type) {
                const t = $('#toast');
                if (!t) return;
                t.textContent = msg;
                t.className = 'toast show' + (type === 'error' ? ' error': type === 'warn' ? ' warn': '');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    t.className = 'toast';
                }, 2600);
            }

            /* ================================================================
   通用弹窗（单例）
   modalOnDismiss：当弹窗被"用户主动关闭"（点 X / 点遮罩 / Esc）时触发。
   调用方设置此回调，以保证 Promise 不会永远挂起。
================================================================ */
            let modalEl = null;
            let modalOnDismiss = null;

            function openModal(opts) {
                if (!modalEl) {
                    modalEl = document.createElement('div');
                    modalEl.className = 'modal-overlay';
                    modalEl.innerHTML = '<div class="modal"><div class="modal-header"><h3></h3><button class="modal-close">&times;</button></div>' +
                    '<div class="modal-body"></div><div class="modal-footer"></div></div>';
                    modalEl.addEventListener('click', e => {
                        if (e.target === modalEl) closeModal();
                    });
                    modalEl.querySelector('.modal-close').addEventListener('click',
                        () => closeModal());
                    document.body.appendChild(modalEl);
                }
                // 重置上一次可能残留的 dismiss 回调（防止意外触发）
                modalOnDismiss = null;
                modalEl.querySelector('h3').textContent = opts.title || '';
                modalEl.querySelector('.modal-body').innerHTML = opts.bodyHTML || '';
                modalEl.querySelector('.modal-footer').innerHTML = opts.footerHTML || '';
                if (opts.width) modalEl.querySelector('.modal').style.width = opts.width;
                modalEl.classList.add('show');
                if (opts.onOpen) opts.onOpen(modalEl.querySelector('.modal-body'));
            }

            function closeModal() {
                if (!modalEl) return;
                const wasOpen = modalEl.classList.contains('show');
                modalEl.classList.remove('show');
                const h = modalOnDismiss;
                modalOnDismiss = null;
                if (wasOpen && h) {
                    try {
                        h();
                    } catch (e) {
                        /* ignore */
                    }
                }
            }

            /* Esc 关闭弹窗（同时触发 dismiss） */
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && modalEl && modalEl.classList.contains('show')) {
                    e.preventDefault();
                    closeModal();
                }
            });

            function pixelConfirm(msg) {
                return new Promise(resolve => {
                    let settled = false;
                    const finish = v => {
                        if (settled) return;
                        settled = true;
                        if (modalEl && modalEl.classList.contains('show')) closeModal();
                        resolve(v);
                    };
                    openModal({
                        title: '操作确认',
                        bodyHTML: '<div style="font-size:14px;color:var(--text-main);padding:6px 2px;line-height:1.8;white-space:pre-wrap">' + escHtml(msg) + '</div>',
                        footerHTML: '<button class="btn btn-danger btn-small" id="cfNo">取消</button><button class="btn btn-success btn-small" id="cfYes">确定</button>',
                        width: '440px'
                    });
                    // 用户点 X / 点遮罩 / Esc → 视为取消
                    modalOnDismiss = () => {
                        if (!settled) {
                            settled = true; resolve(false);
                        }
                    };
                    $('#cfYes').onclick = () => finish(true);
                    $('#cfNo').onclick = () => finish(false);
                });
            }

            function pixelPrompt(msg, defaultValue) {
                return new Promise(resolve => {
                    let settled = false;
                    const finish = v => {
                        if (settled) return;
                        settled = true;
                        if (modalEl && modalEl.classList.contains('show')) closeModal();
                        resolve(v);
                    };
                    openModal({
                        title: '输入',
                        bodyHTML:
                        '<div style="font-size:13px;margin-bottom:8px;color:var(--text-main)">' + escHtml(msg) + '</div>' +
                        '<input type="text" id="pp-input" value="' + escAttr(defaultValue || '') + '" ' +
                        'style="width:100%;padding:10px 12px;border:2px solid var(--border-pixel);' +

                        inp.onkeydown = ev => {
                            if (ev.key === 'Enter') {

                        };
                    }
                    $('#pp-yes').onclick = () => finish(inp ? inp.value.trim(): '');
                    $('#pp-no').onclick = () => finish(null);
                });

            /* ---------- 文件 IO ---------- */
            function pickFile(accept) {
                return new Promise((resolve, reject) => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    if (accept) input.accept = accept;
                    input.onchange = () => {
                        const f = input.files && input.files[0];
                        if (!f) {
                            reject(new Error('未选择文件')); return;
                        }
                        const reader = new FileReader();
                        reader.onload = e => resolve({
                            name: f.name, text: e.target.result
                        });
                        reader.onerror = () => reject(new Error('文件读取失败'));
                        reader.readAsText(f);
                    };
                    input.click();
                });
            }
            function downloadFile(name, content, mime) {
                const blob = new Blob([content],
                    {
                        type: mime || 'application/octet-stream'
                    });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = name;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url),
                    1000);
            }

            /* ================================================================
   纯 JS ZIP 打包（零依赖）
   - 优先用 CompressionStream('deflate-raw') 压缩
   - 不支持则自动降级为 store 模式（不压缩）
================================================================ */
            const HAS_COMPRESSION = typeof CompressionStream === 'function';

            // CRC32 查表（只算一次）
            const CRC32_TABLE = (() => {
                const t = new Uint32Array(256);
                for (let n = 0; n < 256; n++) {
                    let c = n;
                    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)): (c >>> 1);
                    t[n] = c >>> 0;
                }
                return t;
            })();
            function crc32(bytes) {
                let c = 0xFFFFFFFF;
                for (let i = 0; i < bytes.length; i++) {
                    c = CRC32_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
                }
                return (c ^ 0xFFFFFFFF) >>> 0;
            }

            // 字符串 → UTF-8 字节
            const _utf8Encoder = new TextEncoder();
            function strToUtf8(str) {
                return _utf8Encoder.encode(str);
            }

            // 小端写入
            function wrU16(buf, off, v) {
                buf[off] = v & 0xFF; buf[off + 1] = (v >>> 8) & 0xFF;
            }
            function wrU32(buf, off, v) {
                buf[off] = v & 0xFF;
                buf[off + 1] = (v >>> 8) & 0xFF;
                buf[off + 2] = (v >>> 16) & 0xFF;
                buf[off + 3] = (v >>> 24) & 0xFF;
            }

            // 时间 → DOS 时间/日期
            function dosDateTime(d) {
                return {
                    date: (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF,
                    time: ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF
                };
            }

            // 用 CompressionStream 做 raw deflate
            async function deflateRaw(bytes) {
                const cs = new CompressionStream('deflate-raw');
                const writer = cs.writable.getWriter();
                await writer.write(bytes);
                await writer.close();
                const reader = cs.readable.getReader();
                const chunks = [];
                let total = 0;
                for (;;) {
                    const {
                        done,
                        value
                    } = await reader.read();
                    if (done) break;
                    chunks.push(value); total += value.length;
                }
                const out = new Uint8Array(total);
                let off = 0;
                for (const c of chunks) {
                    out.set(c, off); off += c.length;
                }
                return out;
            }

            /**
            * 生成 ZIP Blob
            * @param {Array<{name:string, data:Uint8Array}>} entries
            * @returns {Promise<Blob>}
            */
            async function buildZip(entries) {
                const dt = dosDateTime(new Date());
                const localParts = [];
                const centralParts = [];
                let offset = 0;

                for (const e of entries) {
                    const nameBytes = strToUtf8(e.name);
                    const raw = e.data;
                    const crc = crc32(raw);
                    const uncompressedSize = raw.length;

                    // 小文件不压缩（省 CPU 且压缩后可能更大）
                    let payload = raw;
                    let method = 0; // 0=store, 8=deflate
                    if (HAS_COMPRESSION && uncompressedSize > 512) {
                        try {
                            const compressed = await deflateRaw(raw);
                            if (compressed.length < raw.length) {
                                payload = compressed;
                                method = 8;
                            }
                        } catch (err) {
                            /* 出错就降级到 store */
                        }
                    }
                    const compressedSize = payload.length;

                    // --- 本地文件头 (30 + nameLen) ---
                    const lh = new Uint8Array(30 + nameBytes.length);
                    wrU32(lh, 0, 0x04034b50);
                    wrU16(lh, 4, 20); // 解压所需版本
                    wrU16(lh, 6, 0x0800); // 通用 flag: UTF-8
                    wrU16(lh, 8, method);
                    wrU16(lh, 10, dt.time);
                    wrU16(lh, 12, dt.date);
                    wrU32(lh, 14, crc);
                    wrU32(lh, 18, compressedSize);
                    wrU32(lh, 22, uncompressedSize);
                    wrU16(lh, 26, nameBytes.length);
                    wrU16(lh, 28, 0); // extra field 长度
                    lh.set(nameBytes, 30);

                    localParts.push(lh, payload);

                    // --- 中央目录项 (46 + nameLen) ---
                    const ch = new Uint8Array(46 + nameBytes.length);
                    wrU32(ch, 0, 0x02014b50);
                    wrU16(ch, 4, 20); // 创建版本
                    wrU16(ch, 6, 20); // 解压所需版本
                    wrU16(ch, 8, 0x0800);
                    wrU16(ch, 10, method);
                    wrU16(ch, 12, dt.time);
                    wrU16(ch, 14, dt.date);
                    wrU32(ch, 16, crc);
                    wrU32(ch, 20, compressedSize);
                    wrU32(ch, 24, uncompressedSize);
                    wrU16(ch, 28, nameBytes.length);
                    wrU16(ch, 30, 0); // extra
                    wrU16(ch, 32, 0); // comment
                    wrU16(ch, 34, 0); // disk start
                    wrU16(ch, 36, 0); // internal attrs
                    wrU32(ch, 38, 0); // external attrs
                    wrU32(ch, 42, offset); // 本地头偏移
                    ch.set(nameBytes, 46);
                    centralParts.push(ch);

                    offset += lh.length + compressedSize;
                }

                const cdSize = centralParts.reduce((s, c) => s + c.length, 0);
                const cdOffset = offset;

                // --- EOCD (End of Central Directory, 22 字节) ---
                const eocd = new Uint8Array(22);
                wrU32(eocd, 0, 0x06054b50);
                wrU16(eocd, 4, 0);
                wrU16(eocd, 6, 0);
                wrU16(eocd, 8, entries.length);
                wrU16(eocd, 10, entries.length);
                wrU32(eocd, 12, cdSize);
                wrU32(eocd, 16, cdOffset);
                wrU16(eocd, 20, 0);

                return new Blob([...localParts, ...centralParts, eocd], {
                    type: 'application/zip'
                });
            }

            async function downloadFiles(files) {
                if (!files || !files.length) return;

                // 单文件：直接下，不打包
                if (files.length === 1) {
                    downloadFile(files[0].name, files[0].content, files[0].mime);
                    showToast('已导出 1 个文件');
                    return;
                }

                try {
                    showToast('正在打包 ' + files.length + ' 个文件...');
                    const entries = files.map(f => ({
                        name: f.name,
                        data: typeof f.content === 'string'
                        ? strToUtf8(f.content): new Uint8Array(f.content)
                    }));
                    const blob = await buildZip(entries);
                    const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                    downloadFile('BVN_export_' + stamp + '.zip', blob, 'application/zip');
                    showToast('已导出 ' + files.length + ' 个文件 (zip)');
                } catch (err) {
                    showToast('打包失败: ' + err.message, 'error');
                }
            }

                const t = e.target;

                    const dd = toggle.closest('.toolbar-dropdown');
                    const wasOpen = dd.classList.contains('open');
                    closeAllDropdowns();
                    if (!wasOpen) dd.classList.add('open');
                    return true;
                }
                if (t.closest('.dropdown-menu')) {
                    closeAllDropdowns();
                    return false;
                }
                return false;
            }

                if (!e.target.closest('.toolbar-dropdown')) closeAllDropdowns();

                function importData(json) {
                    const report = [];
                    if (!json || typeof json !== 'object') return {
                        ok: false,
                        msg: '文件不是有效的 JSON 对象'
                    };
                    ['fighter',
                        'assist',
                        'map'].forEach(key => {
                            const block = json[key];
                            if (block && Array.isArray(block.data)) {
                                const list = key === 'fighter' ? fighter: key === 'assist' ? assist: map;
                                let n = 0;
                                block.data.forEach(it => {
                                    if (it && it.id && it.name && !list[it.id]) {
                                        list[it.id] = it.name; n++;
                                    }
                                });
                                if (key !== 'map') {
                                    block.data.forEach(it => {
                                        if (it && it.id && it.name && !fighterList.some(x => x.id === it.id)) {
                                            fighterList.push({
                                                id: it.id, name: it.name, type: it.comic_type === undefined ? -1: it.comic_type
                                            });
                                        }
                                    });
                                }
                                if (n) report.push(key + '字典 +' + n);
                            }
                        });
                    ['fighter', 'assist'].forEach(key => {
                        const block = json[key];
                        if (block && typeof block === 'object' && !Array.isArray(block.data)) {
                            const list = key === 'fighter' ? fighter: assist;
                            let n = 0;
                            Object.entries(block).forEach(([id, info]) => {
                                if (info && typeof info === 'object' && info.name && !list[id]) {
                                    list[id] = info.name; n++;
                                }
                            });
                            if (n) report.push(key + '字典 +' + n);
                        }
                    });
                    if (json.map && typeof json.map === 'object' && !Array.isArray(json.map.data)) {
                        let n = 0;
                        Object.entries(json.map).forEach(([id, info]) => {
                            const name = (info && typeof info === 'object' ? info.name: info);
                            if (name && typeof name === 'string' && !map[id]) {
                                map[id] = name; n++;
                            }
                        });
                        if (n) report.push('地图字典 +' + n);
                    }
                    if (report.length === 0) {
                        const keys = Object.keys(json);
                        const isGeneric = keys.length > 0 && !keys.some(k => ['fighter', 'assist', 'map'].includes(k));
                        if (isGeneric) {
                            let n = 0;
                            keys.forEach(k => {
                                const v = json[k];
                                const name = (v && typeof v === 'object') ? v.name: v;
                                if (name && typeof name === 'string' && !fighter[k]) {
                                    fighter[k] = name; n++;
                                }
                            });
                            if (n) report.push('通用字典 +' + n);
                        }
                    }
                    return report.length ? {
                        ok: true,
                        msg: report.join('，')
                    }: {
                        ok: false,
                        msg: '无法识别的字典格式'
                    };
                }
                function exportData() {
                    return JSON.stringify({
                        fighter_dict: fighter, assist_dict: assist, map_dict: map
                    }, null, 2);
                }

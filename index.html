                /* 局部刷新：只更新单个列表项的标题和元数据 */
                function refreshMissionItemMeta(idx) {
                    const m = state.gameData && state.gameData.missions && state.gameData.missions[idx];
                    if (!m || !state.root) return;
                    const item = state.root.querySelector('.mission-item[data-idx="' + idx + '"]');
                    if (!item) return;
                    const mapName = Dict.mapName(m.map) || '';
                    const titleEl = item.querySelector('.mi-title');
                    const metaEl = item.querySelector('.mi-meta');
                    if (titleEl) {
                        titleEl.innerHTML = '关卡 ' + (idx + 1) + ' — ' + escHtml(m.map || '未设置') +
                        (mapName ? ' <span class="id-name">' + escHtml(mapName) + '</span>': '');
                    }
                    if (metaEl) {
                        const wc = m.waves ? m.waves.length: 0;
                        let ec = 0; const bosses = [];
                        (m.waves || []).forEach(w => (w.enemies || []).forEach(en => {
                            ec++; if (en.isBoss) bosses.push(en.id);
                        }));
                        metaEl.textContent = wc + ' 波 · ' + ec + ' 种敌人 · Lv.' + (m.enemyLevel ?? '?') +
                        ' · ' + (m.time ?? '?') + 's' + (bosses.length ? ' · ⚔ ' + bosses.join(', '): '');
                    }
                }
                function filterMissions(kw) {
                    const items = $$('#le-list .mission-item');
                    kw = (kw || '').toLowerCase();
                    items.forEach(it => {
                        it.style.display = it.textContent.toLowerCase().includes(kw) ? '': 'none';
                    });
                }
                function selectMission(idx) {
                    state.currentMissionIdx = idx; renderMissionList(); renderEditor(idx);
                }

                function renderEditor(idx) {
                    const none = $('#le-none'), content = $('#le-content');
                    if (!state.gameData || idx < 0 || idx >= state.gameData.missions.length) {
                        none.style.display = 'flex'; content.style.display = 'none'; return;
                    }
                    none.style.display = 'none'; content.style.display = 'block';
                    const m = state.gameData.missions[idx];
                    const mapTags = KNOWN_MAPS.map(mp => '<span class="map-tag' + (m.map === mp ? ' selected': '') + '" data-map="' + mp + '">' + mp + '</span>').join('');
                    content.innerHTML =
                    '<div class="tabs">' +
                    '<button class="tab-btn active" data-edit-tab="basic">基本设置</button>' +
                    '<button class="tab-btn" data-edit-tab="waves">波次编辑 (' + (m.waves ? m.waves.length: 0) + ')</button>' +
                    '<button class="tab-btn" data-edit-tab="overview">全局预览</button>' +
                    '</div>' +
                    '<div class="tab-content active" id="le-tab-basic">' +
                    '<div class="edit-section"><h3>📋 关卡基本属性</h3>' +
                    '<div class="form-row">' +
                    '<div class="form-group"><label>地图名称</label><input type="text" value="' + escAttr(m.map || '') + '" data-field="map"></div>' +
                    '<div class="form-group small"><label>时间限制 (秒)</label><input type="number" value="' + escAttr(m.time ?? 0) + '" data-field="time"></div>' +
                    '<div class="form-group small"><label>敌人等级</label><input type="number" value="' + escAttr(m.enemyLevel ?? 0) + '" data-field="enemyLevel"></div>' +
                    '</div>' +
                    '<div style="margin-top:8px"><label style="font-size:12px;color:#888;font-weight:600">快速选择地图：</label><div class="map-tags">' + mapTags + '</div></div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="tab-content" id="le-tab-waves">' +
                    '<div class="edit-section"><h3>🌊 波次配置 ' +
                    '<button class="btn btn-success btn-small" data-act="addWave">+ 添加波次</button>' +
                    '<button class="btn btn-primary btn-small" data-act="copyWave">📋 复制上一波</button>' +
                    '</h3>' + renderWaves(m) + '</div>' +
                    '</div>' +
                    '<div class="tab-content" id="le-tab-overview">' +
                    '<div class="edit-section"><h3>📊 关卡预览</h3>' + renderOverview(m) + '</div>' +
                    '</div>';
                }
                function switchEditorTab(tabId, btn) {
                    $$('#le-content .tab-btn').forEach(b => b.classList.remove('active'));
                    $$('#le-content .tab-content').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    const el = $('#le-tab-' + tabId); if (el) el.classList.add('active');
                }
                function renderWaves(m) {
                    if (!m.waves || !m.waves.length) return '<div style="color:#555;padding:20px;text-align:center">暂无波次，点击上方按钮添加</div>';
                    let html = '';
                    m.waves.forEach((w, wi) => {
                        const rows = (w.enemies || []).map((en, ei) => {
                            const name = Dict.charName(en.id);
                            const badge = en.id
                            ? (name
                                ? '<span class="enemy-name-badge' + (en.isBoss ? ' boss': '') + '">' + escHtml(name) + '</span>': '<span class="id-name-unknown">[未知ID]</span>'): '';
                            const hpCell = en.isBoss
                            ? '<input type="number" value="' + escAttr(en.bossHp ?? '') + '" min="0" data-wi="' + wi + '" data-ei="' + ei + '" data-ef="bossHp" placeholder="Boss血量">': '<span style="color:#555">-</span>';
                            return '<tr>' +
                            '<td><span class="pick-btn" data-pick="1" data-wi="' + wi + '" data-ei="' + ei + '">选择</span>' +
                            '<input type="text" value="' + escAttr(en.id || '') + '" data-wi="' + wi + '" data-ei="' + ei + '" data-ef="id" placeholder="敌人ID">' + badge + '</td>' +
                            '<td><input type="number" value="' + (en.count || 1) + '" min="1" data-wi="' + wi + '" data-ei="' + ei + '" data-ef="count"></td>' +
                            '<td style="text-align:center"><input type="checkbox" ' + (en.isBoss ? 'checked': '') + ' data-wi="' + wi + '" data-ei="' + ei + '" data-ef="isBoss"></td>' +
                            '<td data-hp-cell-wi="' + wi + '" data-hp-cell-ei="' + ei + '">' + hpCell + '</td>' +
                            '<td style="width:44px"><button class="btn btn-danger btn-small" data-act="delEnemy" data-wi="' + wi + '" data-ei="' + ei + '">×</button></td>' +
                            '</tr>';
                        }).join('');
                        const hasBoss = (w.enemies || []).some(en => en.isBoss);
                        html += '<div class="wave-card">' +
                        '<div class="wave-header" data-wi="' + wi + '">' +
                        '<h4>🌊 第 ' + (wi + 1) + ' 波' + (hasBoss ? ' <span class="boss-badge">BOSS</span>': '') + '</h4>' +
                        '<div style="display:flex;align-items:center;gap:6px">' +
                        '<button class="btn btn-primary btn-small" data-act="addEnemy" data-wi="' + wi + '" title="添加敌人">+ 敌人</button>' +
                        '<button class="btn btn-danger btn-small" data-act="delWave" data-wi="' + wi + '" title="删除波次">×</button>' +
                        '<span class="wave-toggle">' + (state.collapsedWaves.has(wi) ? '▶': '▼') + '</span>' +
                        '</div>' +
                        '</div>' +
                        '<div class="wave-body' + (state.collapsedWaves.has(wi) ? ' collapsed': '') + '">' +
                        '<div class="form-row">' +
                        '<div class="form-group small"><label>延迟 (秒)</label><input type="number" value="' + (w.hold || 0) + '" min="0" data-wi="' + wi + '" data-wf="hold"></div>' +
                        '<div class="form-group small"><label>持续刷怪</label><select data-wi="' + wi + '" data-wf="repeat">' +
                        '<option value="false"' + (!w.repeat ? ' selected': '') + '>否</option>' +
                        '<option value="true"' + (w.repeat ? ' selected': '') + '>是</option>' +
                        '</select></div>' +
                        '</div>' +
                        '<table class="enemy-table"><colgroup><col style="width:35%"><col style="width:15%"><col style="width:12%"><col style="width:22%"><col style="width:16%"></colgroup>' +
                        '<thead><tr><th>敌人ID</th><th>数量</th><th>Boss</th><th>Boss血量</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>' +
                        '</div>' +
                        '</div>';
                    });
                    return html;
                }
                function renderOverview(m) {
                    let total = 0,
                    bosses = 0,
                    bossHp = 0;
                    (m.waves || []).forEach(w => (w.enemies || []).forEach(en => {
                        total += (en.count || 1);
                        if (en.isBoss) {
                            bosses++; bossHp += (en.bossHp || 0);
                        }
                    }));
                    const timeline = (m.waves || []).map((w,
                        wi) => {
                        const enemies = (w.enemies || []).map(en => escHtml(en.id || '(空)') + (en.isBoss ? '(BOSS:' + escHtml(en.bossHp ?? '') + ')': '') + 'x' + (en.count || 1)).join(', ');
                        return '<div class="timeline-item"><span style="color:#e94560;font-weight:600">Wave ' + (wi + 1) + '</span> ' +
                        '<span style="color:#888;margin:0 8px">延迟' + (w.hold || 0) + 's</span> ' +
                        (w.repeat ? '<span style="color:#f39c12;margin-right:8px">[循环]</span>': '') +
                        '<span style="color:#ccc">' + (enemies || '无') + '</span></div>';
                    }).join('');
                    return '<div class="stat-grid">' +
                    '<div class="stat-card"><div class="num" style="color:#e94560">' + (m.waves ? m.waves.length: 0) + '</div><div class="lbl">总波次</div></div>' +
                    '<div class="stat-card"><div class="num" style="color:#7ec8e3">' + total + '</div><div class="lbl">总敌人数</div></div>' +
                    '<div class="stat-card"><div class="num" style="color:#f39c12">' + bosses + '</div><div class="lbl">Boss数量</div></div>' +
                    '<div class="stat-card"><div class="num" style="color:#1b9c5a">' + bossHp.toLocaleString() + '</div><div class="lbl">Boss总血量</div></div>' +
                    '</div>' +
                    '<div class="info-panel"><h4>波次时间线</h4>' + (timeline || '无波次') + '</div>';
                }


                /* 字段修改：只刷新列表项元数据 + 地图标签高亮 */
                function updateField(field, value) {
                    if (!state.gameData) return;
                    saveUndoCoalesced();
                    const m = state.gameData.missions[state.currentMissionIdx];
                    m[field] = (field === 'time' || field === 'enemyLevel') ? Number(value): value;
                    if (field === 'map') {
                        state.root.querySelectorAll('.map-tag').forEach(t => {
                            t.classList.toggle('selected', t.dataset.map === value);
                        });
                    }
                    refreshMissionItemMeta(state.currentMissionIdx);
                }
                function setMap(mapName) {
                    if (!state.gameData) return;
                    saveUndoCoalesced();
                    state.gameData.missions[state.currentMissionIdx].map = mapName;
                    renderEditor(state.currentMissionIdx); renderMissionList();
                    showToast('地图已设为 ' + mapName);
                }
                function updateWave(wi, field, value) {
                    if (!state.gameData) return;
                    saveUndoCoalesced();
                    const w = state.gameData.missions[state.currentMissionIdx].waves[wi];
                    if (w) w[field] = value;
                }
                /* 局部更新：徽章 / bossHp 单元格 / BOSS badge，保留焦点 */
                function updateEnemy(wi, ei, field, value) {
                    if (!state.gameData) return;
                    saveUndoCoalesced();
                    const wave = state.gameData.missions[state.currentMissionIdx].waves[wi];
                    if (!wave || !wave.enemies || !wave.enemies[ei]) return;
                    const enemy = wave.enemies[ei];
                    enemy[field] = value;
                    if (field === 'isBoss' && !value) enemy.bossHp = 0;

                    if (field === 'id') {
                        const input = state.root.querySelector('input[data-ef="id"][data-wi="' + wi + '"][data-ei="' + ei + '"]');
                        if (input) {
                            let next = input.nextElementSibling;
                            while (next && (next.classList.contains('enemy-name-badge') || next.classList.contains('id-name-unknown'))) {
                                const toRemove = next;
                                next = next.nextElementSibling;
                                toRemove.remove();
                            }
                            if (value) {
                                const name = Dict.charName(value);
                                const span = document.createElement('span');
                                if (name) {
                                    span.className = 'enemy-name-badge' + (enemy.isBoss ? ' boss': '');
                                    span.textContent = name;
                                } else {
                                    span.className = 'id-name-unknown';
                                    span.textContent = '[未知ID]';
                                }
                                input.insertAdjacentElement('afterend', span);
                            }
                        }
                    } else if (field === 'isBoss') {
                        const td = state.root.querySelector('[data-hp-cell-wi="' + wi + '"][data-hp-cell-ei="' + ei + '"]');
                        if (td) {
                            td.innerHTML = value
                            ? '<input type="number" value="' + escAttr(enemy.bossHp ?? '') + '" min="0" data-wi="' + wi + '" data-ei="' + ei + '" data-ef="bossHp" placeholder="Boss血量">': '<span style="color:#555">-</span>';
                        }
                        const header = state.root.querySelector('.wave-header[data-wi="' + wi + '"] h4');
                        if (header) {
                            const hasBoss = (wave.enemies || []).some(en => en.isBoss);
                            header.innerHTML = '🌊 第 ' + (wi + 1) + ' 波' + (hasBoss ? ' <span class="boss-badge">BOSS</span>': '');
                        }
                    }
                    refreshMissionItemMeta(state.currentMissionIdx);
                }
                function addWave() {
                    saveUndo();
                    const m = state.gameData.missions[state.currentMissionIdx];
                    if (!m.waves) m.waves = [];
                    m.waves.push(emptyWave());
                    renderEditor(state.currentMissionIdx); renderMissionList();
                    showToast('已添加新波次');
                }
                function copyLastWave() {
                    saveUndo();
                    const m = state.gameData.missions[state.currentMissionIdx];
                    if (!m.waves || !m.waves.length) m.waves = [emptyWave()];
                    else m.waves.push(deepClone(m.waves[m.waves.length - 1]));
                    renderEditor(state.currentMissionIdx); renderMissionList();
                    showToast('已复制最后一波');
                }
                function deleteWave(wi) {
                    pixelConfirm('确定删除第 ' + (wi + 1) + ' 波？').then(ok => {
                        if (!ok) return;
                        saveUndo();
                        state.gameData.missions[state.currentMissionIdx].waves.splice(wi, 1);
                        const newSet = new Set();
                        state.collapsedWaves.forEach(i => {
                            if (i < wi) newSet.add(i);
                            else if (i > wi) newSet.add(i - 1);
                        });
                        state.collapsedWaves = newSet;
                        renderEditor(state.currentMissionIdx); renderMissionList();
                        showToast('已删除波次');
                    });
                }
                function addEnemy(wi) {
                    saveUndo();
                    const w = state.gameData.missions[state.currentMissionIdx].waves[wi];
                    if (!w.enemies) w.enemies = [];
                    w.enemies.push(emptyEnemy());
                    renderEditor(state.currentMissionIdx); renderMissionList();
                }
                function deleteEnemy(wi, ei) {
                    saveUndo();
                    state.gameData.missions[state.currentMissionIdx].waves[wi].enemies.splice(ei, 1);
                    renderEditor(state.currentMissionIdx); renderMissionList();
                }
                function addMission() {
                    if (!state.gameData) {
                        state.gameData = {
                            missions: []
                        }; state.fileMode = 'missions'; state.fileName = state.fileName || '新建文件.json';
                    }
                    saveUndo();
                    state.gameData.missions.push(emptyMission());
                    renderMissionList(); selectMission(state.gameData.missions.length - 1);
                    App.updateStatusBar(); showToast('已添加新关卡');
                }
                function deleteMission(idx) {
                    if (!state.gameData || !state.gameData.missions) return;
                    pixelConfirm('确定删除关卡 ' + (idx + 1) + '？').then(ok => {
                        if (!ok) return;
                        saveUndo();
                        state.gameData.missions.splice(idx, 1);
                        if (state.currentMissionIdx >= state.gameData.missions.length) state.currentMissionIdx = state.gameData.missions.length - 1;
                        renderMissionList(); renderEditor(state.currentMissionIdx);
                        showToast('已删除关卡');
                    });
                }
                function toggleWave(wi) {
                    const card = $('.wave-card .wave-header[data-wi="' + wi + '"]');
                    if (!card) return;
                    const body = card.nextElementSibling;
                    const icon = card.querySelector('.wave-toggle');
                    if (!body) return;
                    body.classList.toggle('collapsed');
                    icon.textContent = body.classList.contains('collapsed') ? '▶': '▼';
                    if (body.classList.contains('collapsed')) state.collapsedWaves.add(wi);
                    else state.collapsedWaves.delete(wi);
                }
                function openEnemyPicker(wi, ei) {
                    if (!state.gameData) return;
                    const cur = state.gameData.missions[state.currentMissionIdx].waves[wi].enemies[ei].id;
                    Picker.open({
                        title: '选择敌人/角色', items: Dict.fighterList, currentId: cur,
                        onPick: id => {
                            updateEnemy(wi, ei, 'id', id);
                        }
                    });
                }

                function showBatch() {
                    if (!state.gameData) {
                        showToast('没有数据', 'error'); return;
                    }
                    openModal({
                        title: '⚡ 批量调整', width: '560px',
                        bodyHTML:
                        '<div class="edit-section" style="margin-bottom:12px"><h3>全局调整</h3>' +
                        '<div class="form-row"><div class="form-group small"><label>所有关卡时间</label><input type="number" id="bt-time" placeholder="设为(秒)"></div>' +
                        '<div class="form-group small"><label>难度倍率</label><input type="number" id="bt-level" step="0.1" placeholder="乘以"></div></div>' +
                        '<div class="form-row"><div class="form-group small"><label>Boss血量倍率</label><input type="number" id="bt-hp" step="0.1" placeholder="乘以"></div>' +
                        '<div class="form-group small"><label>所有敌人数量</label><input type="number" id="bt-count" placeholder="设为"></div></div>' +
                        '<div class="form-row"><button class="btn btn-primary btn-small" data-bt="time">应用·时间</button>' +
                        '<button class="btn btn-primary btn-small" data-bt="level">应用·难度</button>' +
                        '<button class="btn btn-primary btn-small" data-bt="hp">应用·Boss血</button>' +
                        '<button class="btn btn-primary btn-small" data-bt="count">应用·数量(非Boss)</button></div>' +
                        '</div>',
                        footerHTML: '<button class="btn btn-primary btn-small" data-bt-close>关闭</button>'
                    });
                    const body = modalEl.querySelector('.modal-body');
                    const foot = modalEl.querySelector('.modal-footer');
                    body.onclick = e => {
                        const bt = e.target.closest('[data-bt]');
                        if (!bt) return;
                        const idMap = {
                            time: 'bt-time',
                            level: 'bt-level',
                            hp: 'bt-hp',
                            count: 'bt-count'
                        };
                        const raw = $('#' + idMap[bt.dataset.bt], body).value;
                        const v = Number(raw);
                        if (raw === '' || isNaN(v)) {
                            showToast('请输入有效数值', 'warn'); return;
                        }
                        saveUndo();
                        const ms = state.gameData.missions;
                        if (bt.dataset.bt === 'time') ms.forEach(m => m.time = v);
                        else if (bt.dataset.bt === 'level') ms.forEach(m => m.enemyLevel = Math.round((m.enemyLevel || 0) * v));
                        else if (bt.dataset.bt === 'hp') ms.forEach(m => (m.waves || []).forEach(w => (w.enemies || []).forEach(en => {
                            if (en.isBoss && en.bossHp) en.bossHp = Math.round(en.bossHp * v);
                        })));
                        else ms.forEach(m => (m.waves || []).forEach(w => (w.enemies || []).forEach(en => {
                            if (!en.isBoss) en.count = v;
                        })));
                        renderMissionList(); renderEditor(state.currentMissionIdx);
                        showToast('批量调整完成');
                    };
                    foot.onclick = e => {
                        if (e.target.closest('[data-bt-close]')) closeModal();
                    };
                }

                function showRawEditor() {
                    if (!state.gameData) {
                        showToast('没有数据', 'error'); return;
                    }
                    openModal({
                        title: '原始 JSON 编辑', width: '760px',
                        bodyHTML: '<textarea class="raw-editor" id="le-raw">' + escHtml(JSON.stringify(state.gameData, null, 2)) + '</textarea>',
                        footerHTML: '<button class="btn btn-primary btn-small" id="le-raw-cancel">取消</button><button class="btn btn-success btn-small" id="le-raw-apply">应用修改</button>'
                    });
                    $('#le-raw-cancel', modalEl).onclick = closeModal;
                    $('#le-raw-apply', modalEl).onclick = () => {
                        try {
                            const newData = JSON.parse($('#le-raw', modalEl).value);
                            saveUndo(); state.gameData = newData;
                            if (newData.way && newData.parts) {
                                state.fileMode = 'route'; state.selectedRouteIdx = -1;
                                renderRouteLeftPanel(); renderRouteEditor();
                            } else {
                                state.fileMode = 'missions';
                                if (!Array.isArray(state.gameData.missions)) state.gameData = {
                                    missions: [state.gameData]
                                };
                                state.currentMissionIdx = Math.min(state.currentMissionIdx, state.gameData.missions.length - 1);
                                renderMissionList(); renderEditor(state.currentMissionIdx);
                            }
                            closeModal(); App.updateStatusBar(); showToast('原始编辑已应用');
                        } catch (err) {
                            showToast('JSON 格式错误: ' + err.message, 'error');
                        }
                    };
                }

                function showDictModal() {
                    openModal({
                        title: '📚 字典管理', width: '560px',
                        bodyHTML:
                        '<div class="info-panel" style="margin-bottom:14px">字典用于将 ID 映射为可读名称。支持 fighter.json / assist.json / map.json / 通用 {id:name} 格式，自动识别。</div>' +
                        '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">' +
                        '<div class="stat-card"><div class="num" style="color:#4cc9f0">' + Object.keys(Dict.fighter).length + '</div><div class="lbl">角色</div></div>' +
                        '<div class="stat-card"><div class="num" style="color:#9b59b6">' + Object.keys(Dict.assist).length + '</div><div class="lbl">辅助</div></div>' +
                        '<div class="stat-card"><div class="num" style="color:#2ecc71">' + Object.keys(Dict.map).length + '</div><div class="lbl">地图</div></div>' +
                        '</div>' +
                        '<div class="import-result" id="le-dict-result" style="margin-top:12px"></div>',
                        footerHTML: '<button class="btn btn-primary btn-small" id="le-dict-export">导出字典</button><button class="btn btn-success btn-small" id="le-dict-import">📂 选择 JSON 导入</button><button class="btn btn-primary btn-small" id="le-dict-close">关闭</button>'
                    });
                    const resEl = $('#le-dict-result', modalEl);
                    $('#le-dict-close', modalEl).onclick = closeModal;
                    $('#le-dict-export', modalEl).onclick = () => {
                        downloadFile('editor_dictionary.json', Dict.exportData(), 'application/json'); showToast('字典已导出');
                    };
                    $('#le-dict-import', modalEl).onclick = async () => {
                        try {
                            const {
                                text
                            } = await pickFile('.json');
                            const json = JSON.parse(text);
                            const r = Dict.importData(json);
                            if (r.ok) {
                                resEl.className = 'import-result ok'; resEl.innerHTML = '✓ ' + escHtml(r.msg); showToast('字典导入成功: ' + r.msg);
                            } else {
                                resEl.className = 'import-result err'; resEl.textContent = '✗ ' + r.msg;
                            }
                            if (state.gameData) {
                                renderMissionList(); renderEditor(state.currentMissionIdx);

                async function prereqAction(act, wi, ni) {
                    const g = state.gameData;
                    if (act === 'add') {
                        const id = await pixelPrompt('输入前置节点 ID:', '');
                        if (!id) return;
                        saveUndo();
                        const w = g.way[wi];
                        if (w.N === null || w.N === undefined) w.N = id;
                        else if (typeof w.N === 'string') w.N = [w.N,
                            id];
                        else w.N.push(id);
                    } else if (act === 'remove') {
                        saveUndo();
                        const w = g.way[wi];
                        w.N.splice(ni, 1);
                        if (!w.N.length) w.N = null;
                        else if (w.N.length === 1) w.N = w.N[0];
                    } else if (act === 'clear') {
                        saveUndo();
                        g.way[wi].N = null;
                    } else if (act === 'up' || act === 'down') {
                        const j = wi + (act === 'up' ? -1: 1);
                        if (j < 0 || j >= g.way.length) return;
                        saveUndo();
                        [g.way[wi],
                            g.way[j]] = [g.way[j],
                            g.way[wi]];
                    } else if (act === 'del') {
                        const ok = await pixelConfirm('确定删除此路线规则？');
                        if (!ok) return;
                        saveUndo(); g.way.splice(wi, 1);
                        renderRouteLeftPanel(); renderRouteEditor(); showToast('已删除路线规则');
                        return;

                    renderRouteLeftPanel(); renderRouteEditor(); showToast('已更新路线规则');

                function partAction(act, idx) {

                function updatePart(idx, value) {

                    saveUndo();
                    const oldVal = g.parts[idx];
                    g.parts[idx] = value;
                    (g.way || []).forEach(w => {
                        if (w.P === oldVal) w.P = value;
                        if (w.N === oldVal) w.N = value;
                        if (Array.isArray(w.N)) w.N = w.N.map(n => n === oldVal ? value: n);
                    });
                    renderRouteLeftPanel(); renderRouteEditor();
                    showToast('已更新节点并同步引用');
                }

                function renderRouteTree() {
                    const g = state.gameData;
                    if (!g.way || !g.way.length) return '<div style="color:#555;padding:20px;text-align:center">暂无路线数据</div>';
                    const childrenMap = {},
                    roots = [];
                    g.way.forEach(w => {
                        if (w.N === null || w.N === undefined) {
                            roots.push(w.P);
                        } else {
                            (Array.isArray(w.N) ? w.N: [w.N]).forEach(p => {
                                if (!childrenMap[p]) childrenMap[p] = [];
                                if (!childrenMap[p].includes(w.P)) childrenMap[p].push(w.P);
                            });
                        }
                    });

                    const renderedFull = new Set(); // 完整展开过的节点（防 DAG 分支爆炸）
                    const visited = new Set(); // 曾出现在树中的节点（用于 orphan 判断）
                    const MAX_REFS = 3; // 单节点展开子节点上限
                    const MAX_DEPTH = 20;

                    function cycleBox(nodeId) {
                        return '<div class="tree-node"><div class="tree-node-box" style="border-color:#e94560;opacity:.6">' +
                        escHtml(nodeId) + ' <span style="font-size:7px">(循环)</span></div></div>';
                    }
                    function refBox(nodeId) {
                        return '<div class="tree-node"><div class="tree-node-box" ' +
                        'style="border-color:var(--accent-purple);opacity:.75;border-style:dashed">↩ ' +
                        escHtml(nodeId) + ' <span style="font-size:7px">(见上方)</span></div></div>';
                    }

                    // ★ 关键：用「递归路径」判断环，而不是全局 visited
                    function renderNode(nodeId, depth, ancestors) {
                        if (ancestors.has(nodeId)) return cycleBox(nodeId); // 真正的环
                        if (depth > MAX_DEPTH) return refBox(nodeId);
                        if (renderedFull.has(nodeId)) return refBox(nodeId); // 多父节点 → 引用

                        renderedFull.add(nodeId);
                        visited.add(nodeId);

                        const children = childrenMap[nodeId] || [];
                        const nextAncestors = new Set(ancestors);
                        nextAncestors.add(nodeId);

                        let html = '<div class="tree-node"><div class="tree-node-box ' +
                        (depth === 0 ? 'root': '') + (children.length ? ' has-children': '') + '">' +
                        escHtml(nodeId) + '</div>';

                        if (children.length) {
                            html += '<div class="tree-connector">|</div><div class="tree-children">';
                            html += children.slice(0, MAX_REFS).map(c => renderNode(c, depth + 1, nextAncestors)).join('');
                            if (children.length > MAX_REFS) {
                                html += '<div style="font-size:8px;color:var(--text-faint);align-self:center">+' +
                                (children.length - MAX_REFS) + ' 个后续</div>';
                            }
                            html += '</div>';
                        }
                        return html + '</div>';
                    }

                    let html = '<div class="route-tree">';
                    roots.forEach(r => html += renderNode(r, 0, new Set()));

                    const orphans = g.way.filter(w => !visited.has(w.P));
                    if (orphans.length) {
                        html += '<div style="width:100%;margin-top:20px;padding:16px;background:#2a1a3e;border:1px solid #e94560">' +
                        '<h4 style="color:#e94560;margin-bottom:12px">未连接的节点</h4>' +
                        '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
                        orphans.map(w => '<div class="tree-node-box" style="border-color:#e94560">' + escHtml(w.P) +
                            ' (前置: ' + escHtml(Array.isArray(w.N) ? w.N.join('+'): w.N) + ')</div>').join('') +
                        '</div></div>';
                    }
                    return html + '</div>';
                }

                function getStatus() {
                    const counts = state.gameData
                    ? (state.fileMode === 'missions'
                        ? '关卡 ' + (state.gameData.missions ? state.gameData.missions.length: 0): '节点 ' + (state.gameData.parts ? state.gameData.parts.length: 0) + ' · 规则 ' + (state.gameData.way ? state.gameData.way.length: 0)): '-';
                    return {
                        file: state.fileName || '',
                        info: counts,
                        modified: state.undo.length > 0,
                        badge: state.fileMode === 'route'
                        ? {
                            text: '路线图模式',
                            cls: 'mode-route'
                        }: state.gameData ? {
                            text: '关卡模式',
                            cls: 'mode-missions'
                        }: null
                    };
                }

                return {
                    id: 'level',
                    title: '关卡编辑器',
                    init,
                    activate,
                    getStatus,
                    shortcuts: {
                        save: saveFile,
                        load: loadFile,
                        undo: undoAction
                    }
                };
            })();
            App.registerModule(LevelEditor);

            /* ================================================================
   模块 2 · 游戏数据编辑器
================================================================ */
            const DataEditor = (function () {
                const TYPES = ['fighter',
                    'assist',
                    'map'];
                const TYPE_TITLES = {
                    fighter: '角色列表',
                    assist: '辅助列表',
                    map: '地图列表'
                };
                const TYPE_FILES = {
                    fighter: 'fighter.json',
                    assist: 'assist.json',
                    map: 'map.json'
                };
                const state = {
                    store: {
                        fighter: {
                            path: {},
                            data: []
                        },
                        assist: {
                            path: {},
                            data: []
                        },
                        map: {
                            path: {},
                            data: []
                        }
                    },
                    fileNames: {
                        fighter: '',
                        assist: '',
                        map: ''
                    },
                    currentType: 'fighter',
                    currentIdx: -1,
                    isModified: false,
                    currentFilter: 'all',
                    undo: createUndo(2 * 1024 * 1024, 100, 800)
                };
                const EMPTY = {
                    fighter: () => ({
                        id: 'new_fighter', name: '新角色', comic_type: 0, start_frame: 1, urls: {
                            file: '', face: '', face_big: '', face_bar: '', face_win: ''
                        }, says: [], hasWarning: true
                    }),
                    assist: () => ({
                        id: 'new_assist', name: '新辅助', comic_type: 0, urls: {
                            file: '', face: '', face_big: ''
                        }, hasWarning: true
                    }),
                    map: () => ({
                        id: 'new_map', name: '新地图'
                    })
                };
                const URL_KEYS = {
                    fighter: ['file',
                        'face',
                        'face_big',
                        'face_bar',
                        'face_win'],
                    assist: ['file',
                        'face',
                        'face_big'],
                    map: []
                };

                function init(root) {
                    root.innerHTML =
                    '<div class="mod-toolbar">' +
                    '<button class="btn btn-primary" data-act="load">📂 加载</button>' +
                    '<button class="btn btn-success" data-act="save">💾 保存</button>' +
                    '<button class="btn btn-danger btn-small" data-act="undo" title="Ctrl+Z">↩ 撤销</button>' +
                    '<div class="toolbar-sep"></div>' +
                    '<div class="toolbar-dropdown">' +
                    '<button class="btn btn-primary" data-dropdown-toggle>▾ 更多</button>' +
                    '<div class="dropdown-menu">' +
                    '<div class="dd-item" data-act="saveAll">📦 全部导出</div>' +
                    '<div class="dd-sep"></div>' +
                    '<div class="dd-item danger" data-act="close">✖ 关闭当前类型</div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="toolbar-sep"></div>' +
                    '<div class="tabs" style="margin:0;border:none">' +
                    '<button class="tab-btn active" data-type-tab="fighter">角色 <span style="font-size:9px;color:var(--accent-yellow);margin-left:4px" id="de-cnt-fighter">0</span></button>' +
                    '<button class="tab-btn" data-type-tab="assist">辅助 <span style="font-size:9px;color:var(--accent-yellow);margin-left:4px" id="de-cnt-assist">0</span></button>' +
                    '<button class="tab-btn" data-type-tab="map">地图 <span style="font-size:9px;color:var(--accent-yellow);margin-left:4px" id="de-cnt-map">0</span></button>' +
                    '</div>' +
                    '</div>' +
                    '<div class="mod-body"><div class="main-layout">' +
                    '<div class="left-panel">' +
                    '<div class="panel-header"><span id="de-left-title">角色列表</span><button class="ph-btn" data-act="add">+ 新增</button></div>' +
                    '<input class="search-box" id="de-search" placeholder="🔍 搜索 ID 或 名称...">' +
                    '<div class="filter-bar" id="de-filter">' +
                    '<div class="filter-btn active" data-filter="all">全部</div>' +
                    '<div class="filter-btn" data-filter="0">死神</div>' +
                    '<div class="filter-btn" data-filter="1">火影</div>' +
                    '<div class="filter-btn" data-filter="other">其他</div>' +
                    '</div>' +
                    '<div class="item-list" id="de-list"></div>' +
                    '<div class="stats-bar">总计: <b id="de-total">0</b> 条目</div>' +
                    '</div>' +
                    '<div class="right-panel" id="de-editor">' +
                    '<div class="no-selection" id="de-none">' +
                    '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>' +
                    '<div>请加载 JSON 文件开始编辑</div>' +
                    '<div style="font-size:12px;color:var(--text-dim)">支持 fighter / assist / map 数据文件</div>' +
                    '<div class="empty-actions">' +
                    '<button class="btn btn-primary" data-act="load">📂 加载文件</button>' +
                    '<button class="btn btn-info" data-act="demo">🎲 试试示例数据</button>' +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '</div></div>';

                    root.addEventListener('click', onClick);
                    root.addEventListener('change', onChange);
                    root.addEventListener('input', e => {
                        if (e.target && e.target.id === 'de-search') renderList();
                    });
                    App.updateStatusBar();
                }
                function activate() {
                    App.updateStatusBar();
                }

                function onClick(e) {
                    if (handleDropdownClick(e)) return;
                    const t = e.target;
                    const tool = t.closest('[data-act]');
                    if (tool) {
                        const act = tool.dataset.act;
                        if (act === 'load') loadFile();
                        else if (act === 'save') saveFile();
                        else if (act === 'saveAll') saveAllFiles();
                        else if (act === 'close') closeFile();
                        else if (act === 'undo') undoAction();
                        else if (act === 'add') addItem();
                        else if (act === 'demo') loadDemo();
                        return;
                    }
                    const tt = t.closest('[data-type-tab]');
                    if (tt) {
                        switchType(tt.dataset.typeTab); return;
                    }
                    const item = t.closest('[data-idx]');
                    if (item && item.dataset.idx !== undefined) {
                        selectItem(+item.dataset.idx); return;
                    }
                    const fb = t.closest('[data-filter]');
                    if (fb) {
                        setFilter(fb.dataset.filter); return;
                    }
                    const actBtn = t.closest('[data-op]');
                    if (actBtn) {
                        const op = actBtn.dataset.op;
                        if (op === 'save') {
                            saveCurrentEdit(); showToast('已保存');
                        } else if (op === 'dup') duplicateItem();
                        else if (op === 'del') deleteItem();
                        else if (op === 'up' || op === 'down') moveItem(op === 'up' ? -1: 1);
                        else if (op === 'addSay') addSay();
                        else if (op === 'addUrl') addUrlField();
                        else if (op === 'delSay') removeSay(+actBtn.dataset.idx);
                        return;
                    }
                }
                function onChange(e) {
                    const t = e.target;
                    if (!t || !t.dataset) return;
                    if (t.dataset.urlkey !== undefined) {
                        onUrlChange(t); return;
                    }
                    if (t.dataset.pathkey) {
                        onPathChange(t); return;
                    }
                    if (t.dataset.sayIdx !== undefined) {
                        onSayChange(+t.dataset.sayIdx, t.value); return;
                    }
                    if (t.id && t.id.indexOf('ed_') === 0) {
                        saveUndoCoalesced();
                        state.isModified = true;
                        saveCurrentEdit();
                    }
                }


                function switchType(type) {
                    if (state.isModified && state.currentIdx >= 0) {
                        pixelConfirm('当前有未保存的修改，切换将保留修改在内存中，是否继续？').then(ok => {
                            if (ok) doSwitchType(type);
                        });
                        return;
                    }
                    doSwitchType(type);
                }
                function doSwitchType(type) {
                    saveCurrentEdit();
                    state.currentType = type;
                    state.currentIdx = -1;
                    state.isModified = false;
                    $$('.mod-toolbar .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.typeTab === type));
                    $('#de-filter').style.display = type === 'map' ? 'none': 'flex';
                    $('#de-left-title').textContent = TYPE_TITLES[type];
                    $('#de-search').value = '';
                    renderList(); renderEditor();
                    App.updateStatusBar();
                }

                async function loadFile() {
                    try {
                        const {
                            name, text
                        } = await pickFile('.json');
                        const json = JSON.parse(text);
                        if (json.fighter && json.fighter.data) {
                            const hasDetailed = json.fighter.data.some(d => d.says || d.start_frame !== undefined || d.bgm);
                            if (hasDetailed) {
                                state.store.fighter = deepClone(json.fighter); state.fileNames.fighter = name; doSwitchType('fighter');
                            } else {
                                state.store.assist = deepClone(json.fighter); state.fileNames.assist = name; doSwitchType('assist');
                            }
                        } else if (json.map && json.map.data) {
                            state.store.map = deepClone(json.map); state.fileNames.map = name; doSwitchType('map');
                        } else {
                            showToast('无法识别的文件格式（需要 fighter/assist/map 的 data 数组）', 'error'); return;
                        }
                        state.isModified = false;
                        updateCounts();
                        showToast('加载成功：' + name);
                        App.updateStatusBar();
                    } catch (err) {
                        showToast('JSON 解析失败: ' + err.message, 'error');
                    }
                }
                function saveFile() {
                    const store = state.store[state.currentType];
                    if (!store || !store.data || !store.data.length) {
                        showToast('当前没有数据', 'warn'); return;
                    }
                    saveCurrentEdit();
                    const key = state.currentType === 'map' ? 'map': 'fighter';
                    downloadFile(state.fileNames[state.currentType] || TYPE_FILES[state.currentType],
                        JSON.stringify({
                            [key]: store
                        }, null, 2), 'application/json');
                    state.isModified = false;
                    App.updateStatusBar();
                    showToast('文件已导出');
                }
                async function saveAllFiles() {
                    saveCurrentEdit();
                    const files = TYPES.filter(t => state.store[t].data && state.store[t].data.length)
                    .map(t => ({
                        name: state.fileNames[t] || TYPE_FILES[t],
                        content: JSON.stringify({
                            [t === 'map' ? 'map': 'fighter']: state.store[t]
                        }, null, 2),
                        mime: 'application/json'
                    }));
                    if (!files.length) {
                        showToast('没有可导出的数据', 'warn'); return;
                    }
                    await downloadFiles(files);
                    state.isModified = false;
                    App.updateStatusBar();
                }
                function closeFile() {
                    if (state.isModified) {
                        pixelConfirm('有未保存的修改，确定关闭吗？').then(ok => {
                            if (ok) doCloseFile();
                        });
                        return;
                    }
                    doCloseFile();
                }
                function doCloseFile() {
                    state.store[state.currentType] = {
                        path: {}, data: []
                    };
                    state.fileNames[state.currentType] = '';
                    state.currentIdx = -1;
                    state.isModified = false;
                    updateCounts(); renderList(); renderEditor();
                    App.updateStatusBar(); showToast('已关闭当前类型文件');
                }

                function saveUndo() {
                    state.undo.push(deepClone(state.store));
                }
                function saveUndoCoalesced() {
                    state.undo.pushCoalesced(deepClone(state.store));
                }

                function undoAction() {
                    const snap = state.undo.pop();
                    if (!snap) {
                        showToast('没有可撤销的操作', 'warn'); return;
                    }
                    state.store = snap;
                    if (state.currentIdx >= (state.store[state.currentType].data || []).length)
                        state.currentIdx = state.store[state.currentType].data.length - 1;
                    state.isModified = true;
                    updateCounts(); renderList(); renderEditor();
                    App.updateStatusBar(); showToast('已撤销');
                }

                /* ---------- 列表渲染与局部 patch ---------- */
                function itemCardHTML(it, idx) {
                    const tl = getTypeLabel(it),
                    tc = getTypeClass(it);
                    let extra = '';
                    if (state.currentType === 'fighter') {
                        extra = [
                            it.start_frame !== undefined ? '帧:' + it.start_frame: '',
                            it.says ? '语录:' + it.says.length: '',
                            it.bgm ? 'BGM': ''
                        ].filter(Boolean).join(' | ');
                    } else if (state.currentType === 'map') {
                        extra = [it.bgm,
                            it.file].filter(Boolean).join(' | ');
                    }
                    return '<div class="item-card' + (idx === state.currentIdx ? ' active': '') + '" data-idx="' + idx + '">' +
                    '<div class="ic-top"><span class="ic-name">' + escHtml(it.name || '未命名') + '</span>' +
                    '<span class="ic-type ' + tc + '">' + tl + '</span></div>' +
                    '<div class="ic-id">' + escHtml(it.id || '') + '</div>' +
                    (extra ? '<div class="ic-extra">' + escHtml(extra) + '</div>': '') + '</div>';
                }
                function renderList() {
                    const store = state.store[state.currentType];
                    const list = $('#de-list');
                    if (!store || !store.data || !store.data.length) {
                        list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);">暂无数据，请加载文件</div>';
                        $('#de-total').textContent = '0';
                        return;
                    }
                    const search = $('#de-search').value.toLowerCase();
                    let items = store.data.map((it, idx) => ({
                        it, idx
                    }))
                    .filter(x => !search || (x.it.id || '').toLowerCase().includes(search) || (x.it.name || '').toLowerCase().includes(search));
                    if (state.currentType !== 'map' && state.currentFilter !== 'all') {
                        items = items.filter(x => {
                            const ct = x.it.comic_type;
                            if (state.currentFilter === '0') return ct === 0;
                            if (state.currentFilter === '1') return ct === 1;
                            return ct !== 0 && ct !== 1;
                        });
                    }
                    list.innerHTML = items.map(({
                        it, idx
                    }) => itemCardHTML(it, idx)).join('') ||
                    '<div style="padding:20px;text-align:center;color:var(--text-dim);">无匹配结果</div>';
                    $('#de-total').textContent = store.data.length;
                }
                /* 局部 patch：只替换指定卡片的 DOM，滚动位置与其他卡片状态保留 */
                function patchItemCard(idx) {
                    const list = $('#de-list');
                    const oldEl = list.querySelector('.item-card[data-idx="' + idx + '"]');
                    if (!oldEl) return false;
                    const it = state.store[state.currentType].data[idx];
                    if (!it) return false;
                    const tmp = document.createElement('div');
                    tmp.innerHTML = itemCardHTML(it, idx);
                    const newEl = tmp.firstElementChild;
                    if (!newEl) return false;
                    oldEl.replaceWith(newEl);
                    return true;
                }

                function getTypeLabel(it) {
                    if (state.currentType === 'map') return 'MAP';
                    if (it.comic_type === 0) return 'BLEACH';
                    if (it.comic_type === 1) return 'NARUTO';
                    if (it.comic_type === -1) return 'RANDOM';
                    return 'OTHER';
                }
                function getTypeClass(it) {
                    if (state.currentType === 'map') return 'type-other';
                    if (it.comic_type === 0) return 'type-bleach';
                    if (it.comic_type === 1) return 'type-naruto';
                    if (it.comic_type === -1) return 'type-random';
                    return 'type-other';
                }
                function setFilter(f) {
                    state.currentFilter = f;
                    $$('#de-filter .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
                    renderList();
                }
                function selectItem(idx) {
                    saveCurrentEdit();
                    const oldIdx = state.currentIdx;
                    state.currentIdx = idx;
                    if (oldIdx !== idx) {
                        const list = $('#de-list');
                        const oldEl = list.querySelector('.item-card[data-idx="' + oldIdx + '"]');
                        if (oldEl) oldEl.classList.remove('active');
                        const newEl = list.querySelector('.item-card[data-idx="' + idx + '"]');
                        if (newEl) newEl.classList.add('active');
                    }
                    renderEditor();
                }

                function renderEditor() {
                    const panel = $('#de-editor');
                    const store = state.store[state.currentType];
                    if (state.currentIdx < 0 || !store || !store.data || !store.data[state.currentIdx]) {
                        panel.innerHTML = '<div class="no-selection">' +
                        '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>' +
                        '<div>请从左侧选择一个条目</div><div style="font-size:12px;color:var(--text-dim)">点击「+ 新增」添加条目</div></div>';
                        return;
                    }
                    const item = store.data[state.currentIdx];
                    if (state.currentType === 'fighter') renderFighterEditor(panel, item);
                    else if (state.currentType === 'assist') renderAssistEditor(panel, item);
                    else renderMapEditor(panel, item);
                }
                function ctOptions(item) {
                    return '<option value="0"' + (item.comic_type === 0 ? ' selected': '') + '>死神 (0)</option>' +
                    '<option value="1"' + (item.comic_type === 1 ? ' selected': '') + '>火影 (1)</option>' +
                    '<option value="-1"' + (item.comic_type === -1 ? ' selected': '') + '>随机 (-1)</option>';
                }
                function urlRows(item) {
                    const urls = item.urls || {};
                    const allKeys = URL_KEYS[state.currentType];
                    const keys = [...allKeys.filter(k => k in urls),
                        ...Object.keys(urls).filter(k => !allKeys.includes(k))];
                    const shown = keys.length ? keys: allKeys;
                    return shown.map(k => '<div class="url-row"><label>' + escHtml(k) + '</label><input type="text" value="' + escAttr(urls[k] || '') + '" data-urlkey="' + escAttr(k) + '" style="font-family:var(--mono-font)"></div>').join('');
                }
                function pathPanel(keys) {
                    const pathData = state.store[state.currentType].path || {};
                    return '<div class="path-panel"><h3>📁 全局路径配置 (path)</h3>' +
                    keys.map(k => '<div class="path-row"><label>' + escHtml(k) + ':</label><input type="text" value="' + escAttr(pathData[k] || '') + '" data-pathkey="' + escAttr(k) + '"></div>').join('') + '</div>';
                }
                function actionBar() {
                    return '<div class="action-bar">' +
                    '<button class="btn btn-success" data-op="save">💾 保存修改</button>' +
                    '<button class="btn btn-warning" data-op="dup">📋 复制</button>' +
                    '<button class="btn btn-danger" data-op="del">🗑 删除</button>' +
                    '<button class="btn btn-primary btn-small" data-op="up">⬆ 上移</button>' +
                    '<button class="btn btn-primary btn-small" data-op="down">⬇ 下移</button></div>';
                }
                function renderFighterEditor(panel, item) {
                    const says = item.says || [];
                    const bgm = item.bgm || {};
                    panel.innerHTML =
                    pathPanel(['fighter', 'face', 'bgm']) +
                    '<div class="edit-section"><h3>📋 基本信息</h3>' +
                    '<div class="form-row">' +
                    '<div class="form-group"><label>ID</label><input type="text" id="ed_id" value="' + escAttr(item.id || '') + '" style="font-family:var(--mono-font)"></div>' +
                    '<div class="form-group"><label>名称</label><input type="text" id="ed_name" value="' + escAttr(item.name || '') + '"></div>' +
                    '<div class="form-group small"><label>阵营</label><select id="ed_comic_type">' + ctOptions(item) + '</select></div>' +
                    '<div class="form-group small"><label>起始帧</label><input type="number" id="ed_start_frame" value="' + escAttr(item.start_frame ?? '') + '"></div>' +
                    '</div>' +
                    '<div class="checkbox-row"><input type="checkbox" id="ed_hasWarning" ' + (item.hasWarning ? 'checked': '') + '><label for="ed_hasWarning">hasWarning</label></div>' +
                    '</div>' +
                    '<div class="edit-section"><h3>📁 资源路径 (urls) <button class="btn btn-primary btn-small" data-op="addUrl">+ 添加字段</button></h3><div class="url-list">' + urlRows(item) + '</div></div>' +
                    '<div class="edit-section"><h3>🎵 BGM</h3><div class="bgm-section">' +
                    '<div class="form-group" style="flex:2"><label>BGM 路径</label><input type="text" id="ed_bgm_url" value="' + escAttr(bgm.url || '') + '" style="font-family:var(--mono-font)"></div>' +
                    '<div class="form-group small"><label>速率 (rate)</label><input type="number" id="ed_bgm_rate" value="' + escAttr(bgm.rate ?? '') + '"></div>' +
                    '</div></div>' +
                    '<div class="edit-section"><h3>💬 语录 (says) — ' + says.length + ' 条 <button class="btn btn-primary btn-small" data-op="addSay">+ 添加语录</button></h3><div class="says-list">' +
                    (says.length ? says.map((s, i) => '<div class="say-item"><span class="say-num">#' + (i + 1) + '</span><textarea id="ed_say_' + i + '" data-say-idx="' + i + '">' + escHtml(s) + '</textarea><button data-op="delSay" data-idx="' + i + '">✖</button></div>').join(''): '<div style="color:#555;font-size:12px;padding:6px 0">暂无语录</div>') +
                    '</div></div>' + actionBar();
                }
                function renderAssistEditor(panel, item) {
                    panel.innerHTML =
                    pathPanel(['fighter', 'face']) +
                    '<div class="edit-section"><h3>📋 基本信息</h3>' +
                    '<div class="form-row">' +
                    '<div class="form-group"><label>ID</label><input type="text" id="ed_id" value="' + escAttr(item.id || '') + '" style="font-family:var(--mono-font)"></div>' +
                    '<div class="form-group"><label>名称</label><input type="text" id="ed_name" value="' + escAttr(item.name || '') + '"></div>' +
                    '<div class="form-group small"><label>阵营</label><select id="ed_comic_type">' + ctOptions(item) + '</select></div>' +
                    '</div>' +
                    '<div class="checkbox-row"><input type="checkbox" id="ed_hasWarning" ' + (item.hasWarning ? 'checked': '') + '><label for="ed_hasWarning">hasWarning</label></div>' +
                    '</div>' +

            const SelectEditor = (function () {
                const state = {
                    data: null,
                    fileName: '',
                    currentTab: 'char',
                    selectedCell: null,
                    clipboard: null,
                    modified: false,
                    showNames: true,
                    originalXmlText: '',
                    undo: createUndo(2 * 1024 * 1024, 100, 800),
                    root: null
                };
                const EMPTY_CELL = () => ({
                    id: '', offset: '', moreFighter: ''
                });
                const EMPTY_ROW = () => ({
                    offset: '', items: Array(10).fill(null).map(EMPTY_CELL)
                });
                const LAYOUT_KEYS = ['x',
                    'y',
                    'width',
                    'height',
                    'left',
                    'right',
                    'top',
                    'bottom'];

                function parseXml(text) {
                    try {
                        const doc = new DOMParser().parseFromString(text, 'text/xml');
                        const err = doc.querySelector('parsererror');
                        if (err) throw new Error(err.textContent || 'XML 格式错误');
                        const result = {
                            layout: {},
                            char_list: [],
                            assist_list: []
                        };
                        const layout = doc.querySelector('layout');
                        if (layout) LAYOUT_KEYS.forEach(k => {
                            result.layout[k] = layout.getAttribute(k) || '0';
                        });
                        function parseSection(tag) {
                            const sec = doc.querySelector(tag);
                            if (!sec) return [];
                            const rows = [];
                            sec.querySelectorAll(':scope > row').forEach(row => {
                                const rd = {
                                    offset: row.getAttribute('offset') || '', items: []
                                };
                                row.querySelectorAll(':scope > item').forEach(it => {
                                    rd.items.push({
                                        id: (it.textContent || '').trim(), offset: it.getAttribute('offset') || '', moreFighter: it.getAttribute('moreFighter') || ''
                                    });
                                });
                                while (rd.items.length < 10) rd.items.push(EMPTY_CELL());
                                rows.push(rd);
                            });
                            return rows;
                        }
                        result.char_list = parseSection('char_list');
                        result.assist_list = parseSection('assist_list');
                        return result;
                    } catch (err) {
                        showToast('XML 解析错误: ' + err.message,
                            'error'); return null;
                    }
                }

                function generateXml(data) {
                    if (!data) return '';
                    const l = data.layout || {};
                    let xml = '<?xml version="1.0" encoding="utf-8"?>\n\n<select_config>\n\t<stage_setting>\n' +
                    '\t\t<layout x="' + escAttr(l.x || 0) + '" y="' + escAttr(l.y || 0) + '" width="' + escAttr(l.width || 800) + '" height="' + escAttr(l.height || 600) + '" left="' + escAttr(l.left || 15) + '" right="' + escAttr(l.right || 15) + '" top="' + escAttr(l.top || 50) + '" bottom="' + escAttr(l.bottom || 0) + '"/>\n' +
                    '\t</stage_setting>\n\n';
                    function writeSection(name, rows) {
                        let s = '\t<' + name + '>\n';
                        rows.forEach(row => {
                            s += '\t\t<row' + (row.offset ? ' offset="' + escAttr(row.offset) + '"': '') + '>\n';
                            row.items.forEach(it => {
                                let attrs = '';
                                if (it.moreFighter) attrs += ' moreFighter="' + escAttr(it.moreFighter) + '"';
                                if (it.offset) attrs += ' offset="' + escAttr(it.offset) + '"';
                                s += it.id ? '\t\t\t<item' + attrs + '>' + escHtml(it.id) + '</item>\n': '\t\t\t<item' + attrs + '></item>\n';
                            });
                            s += '\t\t</row>\n\n';
                        });
                        return s + '\t</' + name + '>\n';
                    }
                    xml += writeSection('char_list', data.char_list || []);
                    xml += '\t<!-- 辅助选择界面 -->\n\n';
                    xml += writeSection('assist_list', data.assist_list || []);
                    xml += '</select_config>\n';
                    return xml;
                }

                    window.addEventListener('resize', function () {

                            showCtx(e, +cell.dataset.row, +cell.dataset.col);

                function onClick(e) {
                    if (handleDropdownClick(e)) return;
                    const t = e.target;

                    if (tool) {
                        const act = tool.dataset.act;
                        if (act === 'load') loadFile();
                        else if (act === 'save') saveFile();
                        else if (act === 'close') closeFile();
                        else if (act === 'undo') undoAction();
                        else if (act === 'dict') openDictModal();
                        else if (act === 'addRow') addRow();
                        else if (act === 'delLast') removeLastRow();

                        ctxAction(ctx.dataset.ctx); return;

                        else if (o === 'rowClear') clearRow(+op.dataset.row);

                    if (t.dataset.cf) {
                        updateItem(t.dataset.cf, t.value); return;

                        updateRowOffset(t.value); return;
